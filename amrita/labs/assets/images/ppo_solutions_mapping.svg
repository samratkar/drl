<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 380" width="740" height="380">
  <rect width="740" height="380" fill="#fcfcfc" rx="8" ry="8" stroke="#dee2e6" stroke-width="1"/>
  
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#6c757d"/>
    </marker>
    <!-- Code Editor Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#111" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="370" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">How PPO Solves Policy Gradient Issues (Code Mapping)</text>

  <!-- ================= LEFT: CONCEPT CARDS ================= -->
  <!-- Concept 1: Sample Efficiency Solution -->
  <rect x="20" y="55" width="220" height="135" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="5" ry="5"/>
  <text x="130" y="78" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e7e34" text-anchor="middle">Solution 1: Sample Efficiency</text>
  
  <!-- Sub-details -->
  <circle cx="45" cy="105" r="3" fill="#2e7d32"/>
  <text x="55" y="108" font-family="Arial, sans-serif" font-size="9.5" fill="#333">K-Epoch Data Reuse Loop</text>
  
  <circle cx="45" cy="125" r="3" fill="#2e7d32"/>
  <text x="55" y="128" font-family="Arial, sans-serif" font-size="9.5" fill="#333">Importance Sampling Ratio</text>
  
  <circle cx="45" cy="145" r="3" fill="#2e7d32"/>
  <text x="55" y="148" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">Allows multiple gradient steps per batch</text>

  <!-- Concept 2: Destructive Updates Prevention -->
  <rect x="20" y="210" width="220" height="135" fill="#ffebee" stroke="#c62828" stroke-width="1.5" rx="5" ry="5"/>
  <text x="130" y="233" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b71c1c" text-anchor="middle">Solution 2: Prevent Destructive Steps</text>
  
  <!-- Sub-details -->
  <circle cx="45" cy="260" r="3" fill="#c62828"/>
  <text x="55" y="263" font-family="Arial, sans-serif" font-size="9.5" fill="#333">Surrogate Ratio Clipping [1-ε, 1+ε]</text>
  
  <circle cx="45" cy="280" r="3" fill="#c62828"/>
  <text x="55" y="283" font-family="Arial, sans-serif" font-size="9.5" fill="#333">Pessimistic Min Operator</text>
  
  <circle cx="45" cy="300" r="3" fill="#c62828"/>
  <text x="55" y="303" font-family="Arial, sans-serif" font-size="9" fill="#6c757d">Restricts updates within a Trust Region</text>


  <!-- ================= RIGHT: CODE EDITOR ================= -->
  <g transform="translate(265, 55)" filter="url(#shadow)">
    <!-- Editor Background -->
    <rect width="455" height="290" fill="#1e1e1e" rx="6" ry="6"/>
    <!-- Editor Header -->
    <path d="M 0 6 A 6 6 0 0 1 6 0 L 449 0 A 6 6 0 0 1 455 6 L 455 25 L 0 25 Z" fill="#2d2d2d"/>
    <circle cx="15" cy="12" r="4.5" fill="#ff5f56"/>
    <circle cx="27" cy="12" r="4.5" fill="#ffbd2e"/>
    <circle cx="39" cy="12" r="4.5" fill="#27c93f"/>
    <text x="227" y="16" font-family="Consolas, Monaco, monospace" font-size="10" fill="#8e8e8e" text-anchor="middle">ppo_optimizer.py</text>
    
    <!-- Code Lines -->
    <g font-family="Consolas, Monaco, monospace" font-size="9.5" fill="#d4d4d4">
      <text x="15" y="45" fill="#6a9955"># --- SOLUTION 1: Reuse data for K epochs ---</text>
      <text x="15" y="60"><tspan fill="#c586c0">for</tspan> epoch <tspan fill="#c586c0">in</tspan> <tspan fill="#dcdcaa">range</tspan>(self.<tspan fill="#4fc1ff">K_epochs</tspan>):</text>
      <text x="35" y="75"><tspan fill="#9cdcfe">probs</tspan> = self.<tspan fill="#dcdcaa">actor</tspan>(states)</text>
      <text x="35" y="90"><tspan fill="#9cdcfe">log_probs</tspan> = <tspan fill="#9cdcfe">dist</tspan>.<tspan fill="#dcdcaa">log_prob</tspan>(actions)</text>
      
      <text x="35" y="115" fill="#6a9955"># Importance sampling ratio corrects off-policy drift</text>
      <text x="35" y="130"><tspan fill="#9cdcfe">ratios</tspan> = torch.<tspan fill="#dcdcaa">exp</tspan>(log_probs - <tspan fill="#9cdcfe">old_log_probs</tspan>)</text>
      
      <text x="35" y="155" fill="#6a9955"># --- SOLUTION 2: Prevent Destructive Updates ---</text>
      <text x="35" y="170"><tspan fill="#9cdcfe">surr1</tspan> = ratios * advantages</text>
      
      <text x="35" y="195" fill="#6a9955"># Clip the ratio to stay within trust region [1-ε, 1+ε]</text>
      <text x="35" y="210"><tspan fill="#9cdcfe">surr2</tspan> = torch.<tspan fill="#dcdcaa">clamp</tspan>(ratios, <tspan fill="#b5cea8">0.8</tspan>, <tspan fill="#b5cea8">1.2</tspan>) * advantages</text>
      
      <text x="35" y="235" fill="#6a9955"># Take the pessimistic minimum of unclipped/clipped</text>
      <text x="35" y="250"><tspan fill="#9cdcfe">actor_loss</tspan> = -torch.<tspan fill="#dcdcaa">min</tspan>(surr1, surr2).<tspan fill="#dcdcaa">mean</tspan>()</text>
      
      <text x="35" y="275"><tspan fill="#9cdcfe">loss</tspan>.<tspan fill="#dcdcaa">backward</tspan>()</text>
    </g>
  </g>

  <!-- ================= CONNECTING LINES ================= -->
  <!-- Solution 1 -> K-epochs loop -->
  <path d="M 240 100 L 260 100 L 260 60 L 280 60" fill="none" stroke="#2e7d32" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Solution 1 -> Ratio calculation -->
  <path d="M 240 135 L 290 135" fill="none" stroke="#2e7d32" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Solution 2 -> clamp -->
  <path d="M 240 260 L 290 260 L 290 210 L 300 210" fill="none" stroke="#c62828" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Solution 2 -> min -->
  <path d="M 240 290 L 300 290 L 300 250 L 310 250" fill="none" stroke="#c62828" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
