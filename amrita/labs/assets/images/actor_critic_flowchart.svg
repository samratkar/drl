<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <rect width="600" height="380" fill="#fcfcfc" rx="10" ry="10" stroke="#dee2e6" stroke-width="1"/>
  
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">Actor-Critic Architecture Flowchart (One-Step TD)</text>
  
  <!-- Flow lines and connectors -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#495057"/>
    </marker>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#1e7e34"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd7e14"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>

  <!-- Interactive Loop Area -->
  <rect x="20" y="60" width="560" height="300" fill="none" stroke="#28a745" stroke-dasharray="4,4" stroke-width="1.2" rx="8" ry="8"/>
  <text x="35" y="80" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#28a745">Online Step-by-Step Transition &amp; Learning (At every step t)</text>

  <!-- State S_t -->
  <rect x="40" y="180" width="80" height="40" fill="#e9ecef" stroke="#495057" stroke-width="1.5" rx="5" ry="5"/>
  <text x="80" y="205" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">State S_t</text>

  <!-- Split paths from S_t -->
  <path d="M 120 200 L 140 200 L 140 130 L 160 130" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 120 200 L 140 200 L 140 270 L 160 270" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Actor (Policy Network) -->
  <rect x="160" y="100" width="110" height="60" fill="url(#blueGrad)" stroke="#004085" stroke-width="1.5" rx="5" ry="5"/>
  <text x="215" y="128" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Actor</text>
  <text x="215" y="145" font-family="Arial, sans-serif" font-size="10" fill="#e2f0d9" text-anchor="middle">Policy π_θ(a|s)</text>

  <!-- Critic (Value Network) -->
  <rect x="160" y="240" width="110" height="60" fill="url(#greenGrad)" stroke="#1e7e34" stroke-width="1.5" rx="5" ry="5"/>
  <text x="215" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Critic</text>
  <text x="215" y="285" font-family="Arial, sans-serif" font-size="10" fill="#d4edda" text-anchor="middle">Value V_w(s)</text>

  <!-- Actor -> Action -->
  <line x1="270" y1="130" x2="300" y2="130" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Action A_t -->
  <circle cx="320" cy="130" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="320" y="134" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#01579b" text-anchor="middle">A_t</text>

  <!-- Action -> Environment -->
  <line x1="338" y1="130" x2="370" y2="130" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Environment -->
  <rect x="370" y="110" width="90" height="40" fill="#343a40" stroke="#212529" stroke-width="1.5" rx="5" ry="5"/>
  <text x="415" y="135" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Environment</text>

  <!-- Environment -> Transition Output -->
  <line x1="460" y1="130" x2="490" y2="130" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Transition Reward and Next State -->
  <rect x="490" y="105" width="75" height="50" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="4" ry="4"/>
  <text x="527" y="125" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333" text-anchor="middle">S_t+1, R_t+1</text>
  <text x="527" y="142" font-family="Arial, sans-serif" font-size="8" fill="#6c757d" text-anchor="middle">(Next Step)</text>

  <!-- Critic V(S_t) Value out -->
  <line x1="270" y1="270" x2="330" y2="270" stroke="#495057" stroke-width="1.5"/>

  <!-- TD Target calculation block -->
  <rect x="330" y="240" width="125" height="60" fill="#ffebee" stroke="#c62828" stroke-width="1.5" rx="5" ry="5"/>
  <text x="392" y="265" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c62828" text-anchor="middle">TD Target</text>
  <text x="392" y="285" font-family="Arial, sans-serif" font-size="10" fill="#b71c1c" text-anchor="middle">R_t+1 + γ V_w(S_t+1)</text>

  <!-- Path from Transition (S_t+1, R_t+1) to TD Target -->
  <path d="M 527 195 L 392 195 L 392 240" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TD Error (Criticism) Subtraction Circle -->
  <circle cx="490" cy="270" r="18" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5"/>
  <text x="490" y="274" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404" text-anchor="middle">δ_t</text>
  <text x="490" y="303" font-family="Arial, sans-serif" font-size="9" fill="#856404" font-weight="bold" text-anchor="middle">TD Error</text>

  <!-- Connectors to TD Error -->
  <line x1="455" y1="270" x2="472" y2="270" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 300 270 L 300 320 L 490 320 L 490 288" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Feedback updates back to Actor and Critic -->
  <!-- Update Actor -->
  <path d="M 490 252 L 490 220 L 215 220 L 215 162" fill="none" stroke="#fd7e14" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="215" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#d35400">Update Actor: θ ← θ + α γ^t δ ∇logπ</text>

  <!-- Update Critic -->
  <path d="M 490 252 L 490 230 L 250 230 L 250 240" fill="none" stroke="#1e7e34" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="352" y="340" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#1e7e34">Update Critic: w ← w + β δ ∇V</text>

  <!-- Loop back to next step -->
  <path d="M 565 130 L 580 130 L 580 350 L 80 350 L 80 222" fill="none" stroke="#6c757d" stroke-dasharray="2,2" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
