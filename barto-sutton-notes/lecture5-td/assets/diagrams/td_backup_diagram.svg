<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Arial, sans-serif">
  <rect width="800" height="300" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">TD(0) Backup Diagram & Backup Logic</text>
  
  <!-- State s -->
  <circle cx="200" cy="100" r="25" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="200" y="105" text-anchor="middle" font-size="12" font-weight="bold">s</text>
  
  <!-- Transition -->
  <path d="M 225 100 Q 300 100 375 180" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="120" text-anchor="middle" font-size="11" fill="#C62828">r (Reward)</text>
  
  <!-- State s' -->
  <circle cx="400" cy="200" r="25" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="400" y="205" text-anchor="middle" font-size="12" font-weight="bold">s'</text>
  
  <!-- Formula context -->
  <rect x="500" y="80" width="250" height="120" fill="#F5F5F5" stroke="#999" rx="5"/>
  <text x="515" y="105" font-size="12" font-weight="bold">TD(0) Update:</text>
  <text x="515" y="130" font-size="11">V(s) &lt;- V(s) + alpha * [r + gamma*V(s') - V(s)]</text>
  <text x="515" y="155" font-size="11" fill="#C62828">Target: r + gamma*V(s')</text>
  <text x="515" y="175" font-size="11" fill="#1565C0">Current: V(s)</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>