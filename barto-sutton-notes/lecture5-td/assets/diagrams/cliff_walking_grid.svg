<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360">
  <style>
    .bg { fill: #181825; }
    .text-title { font-family: 'Inter', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #cdd6f4; }
    .text-subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #bac2de; }
    .cell-normal { fill: #1e1e2e; stroke: #313244; stroke-width: 1.5; }
    .cell-cliff { fill: #451e2b; stroke: #f38ba8; stroke-width: 1.5; }
    .cell-start { fill: #1b2b4a; stroke: #89b4fa; stroke-width: 2; }
    .cell-goal { fill: #1c3d32; stroke: #a6e3a1; stroke-width: 2; }
    .text-cell { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #cdd6f4; }
    .text-cell-dark { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; fill: #f38ba8; }
    .path-sarsa { stroke: #89dceb; stroke-width: 3.5; stroke-dasharray: 6,4; fill: none; stroke-linecap: round; marker-end: url(#arrow-sarsa); }
    .path-q { stroke: #fab387; stroke-width: 3.5; fill: none; stroke-linecap: round; marker-end: url(#arrow-q); }
    .legend-text { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #a6adc8; }
    .arrow-marker { fill: context-fill; }
  </style>
  <rect width="100%" height="100%" class="bg" rx="12"/>
  <text x="30" y="32" class="text-title">Cliff Walking Gridworld</text>
  <text x="30" y="50" class="text-subtitle">Comparing pathways learned by Sarsa (safer) vs. Q-learning (optimal but risky)</text>
  <defs>
