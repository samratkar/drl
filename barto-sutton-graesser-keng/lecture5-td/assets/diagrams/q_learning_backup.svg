<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Q-learning Backup Diagram (Off-policy) -->
  <style>
    .node-action { fill: #1E293B; stroke: #0F172A; stroke-width: 1.5; }
    .node-action-other { fill: #94A3B8; stroke: #64748B; stroke-width: 1.2; }
    .node-state { fill: #FFFFFF; stroke: #10B981; stroke-width: 3; }
    .line-main { stroke: #0F172A; stroke-width: 2.5; fill: none; }
    .line-other { stroke: #64748B; stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .line-max-arc { stroke: #10B981; stroke-width: 2; fill: none; }
    .text-math { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #0F172A; }
    .text-max { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #10B981; font-weight: bold; text-anchor: middle; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #64748B; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="100" y="20" class="title">Q-LEARNING (Off-Policy)</text>

  <!-- Top State-Action Node (S_t, A_t) -->
  <line x1="100" y1="50" x2="100" y2="130" class="line-main" />
  <circle cx="100" cy="50" r="7" class="node-action" />
  <text x="112" y="54" class="text-math">(S<t sub="t">t</t>, A<t sub="t">t</t>)</text>

  <!-- Transition Reward R_{t+1} -->
  <text x="112" y="95" class="text-math" fill="#EF4444">R<t sub="t+1">t+1</t></text>

  <!-- State Node S_{t+1} -->
  <circle cx="100" cy="130" r="11" class="node-state" />
  <text x="116" y="134" class="text-math">S<t sub="t+1">t+1</t></text>

  <!-- Branches for next actions -->
  <!-- Greedy Action (solid line) -->
  <line x1="100" y1="130" x2="100" y2="210" class="line-main" />
  <circle cx="100" cy="210" r="7" class="node-action" />
  <text x="112" y="214" class="text-math" font-weight="bold">a* (greedy)</text>

  <!-- Alternative Actions (dashed lines) -->
  <line x1="100" y1="130" x2="50" y2="200" class="line-other" />
  <circle cx="50" cy="200" r="5" class="node-action-other" />

  <line x1="100" y1="130" x2="150" y2="200" class="line-other" />
  <circle cx="150" cy="200" r="5" class="node-action-other" />

  <!-- Max Arc representing the maximization operation -->
  <path d="M 68 175 A 40 40 0 0 1 132 175" class="line-max-arc" />
  <text x="100" y="165" class="text-max">max</text>
</svg>
