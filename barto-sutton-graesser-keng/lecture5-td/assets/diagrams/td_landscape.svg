<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">The Reinforcement Learning Landscape: Relationship of TD</text>

  <!-- DP Section -->
  <rect x="50" y="80" width="200" height="100" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2" rx="10"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#7B1FA2">Dynamic Programming</text>
  <text x="150" y="130" text-anchor="middle" font-size="10">Uses Model (P, R)</text>
  <text x="150" y="145" text-anchor="middle" font-size="10">Full Backups</text>

  <!-- TD Section -->
  <rect x="300" y="80" width="200" height="100" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="10"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">Temporal Difference</text>
  <text x="400" y="130" text-anchor="middle" font-size="10">No Model Needed</text>
  <text x="400" y="145" text-anchor="middle" font-size="10">Sample Backups + Bootstrap</text>

  <!-- MC Section -->
  <rect x="550" y="80" width="200" height="100" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" rx="10"/>
  <text x="650" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">Monte Carlo</text>
  <text x="650" y="130" text-anchor="middle" font-size="10">No Model Needed</text>
  <text x="650" y="145" text-anchor="middle" font-size="10">Full Returns (No Bootstrap)</text>

  <!-- Arrows -->
  <path d="M 250 130 L 290 130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="125" text-anchor="middle" font-size="9">Sampled</text>
  
  <path d="M 500 130 L 540 130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="125" text-anchor="middle" font-size="9">Bootstrap</text>

  <!-- Summary box -->
  <rect x="100" y="250" width="600" height="120" fill="#FAFAFA" stroke="#999" rx="5"/>
  <text x="120" y="275" font-size="12" font-weight="bold">Synthesis of TD Learning:</text>
  <text x="120" y="300" font-size="11">1. TD is like DP: It updates estimates based on other estimates (Bootstrapping).</text>
  <text x="120" y="325" font-size="11">2. TD is like MC: It learns from actual experience without a transition model (Sampling).</text>
  <text x="120" y="350" font-size="11">3. Advantage: TD can learn online, step-by-step, before the final outcome is known.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>