<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">Advanced TD: n-Step and Eligibility Traces</text>

  <!-- n-step TD Section -->
  <g transform="translate(50, 60)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2E7D32">n-Step TD (n=3)</text>
    <circle cx="50" cy="50" r="10" fill="#2E7D32"/>
    <text x="50" y="75" text-anchor="middle" font-size="10">s_t</text>
    <path d="M 60 50 L 140 50" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="45" font-size="9">r_t+1</text>
    <circle cx="150" cy="50" r="10" fill="#A5D6A7"/>
    <path d="M 160 50 L 240 50" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="200" y="45" font-size="9">r_t+2</text>
    <circle cx="250" cy="50" r="10" fill="#A5D6A7"/>
    <path d="M 260 50 L 340 50" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="300" y="45" font-size="9">r_t+3</text>
    <circle cx="350" cy="50" r="10" fill="#1565C0" stroke="#2E7D32" stroke-width="2"/>
    <text x="350" y="75" text-anchor="middle" font-size="10">V(s_t+3)</text>
    
    <text x="200" y="120" text-anchor="middle" font-size="10" font-style="italic">Updates using next 3 rewards + Bootstrap</text>
  </g>

  <!-- Eligibility Traces Section -->
  <g transform="translate(50, 220)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#AD1457">Eligibility Traces (TD-lambda)</text>
    <!-- Decay curve -->
    <path d="M 50 100 L 50 20 Q 150 100 350 100" fill="none" stroke="#AD1457" stroke-width="2"/>
    <text x="50" y="15" text-anchor="middle" font-size="10" fill="#AD1457">Event occurs</text>
    <text x="200" y="120" text-anchor="middle" font-size="10" font-style="italic">Graceful decay of "credit" for past states</text>
    
    <!-- Timeline -->
    <line x1="50" y1="100" x2="350" y2="100" stroke="black" marker-end="url(#arrow)"/>
    <text x="360" y="105" font-size="10">Time</text>
  </g>

  <!-- Defs -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>