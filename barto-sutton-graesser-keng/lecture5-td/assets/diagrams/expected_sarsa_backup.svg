<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="220" height="260">
  <!-- Expected Sarsa Backup Diagram (On/Off-policy) -->
  <style>
    .node-action { fill: #1E293B; stroke: #0F172A; stroke-width: 1.5; }
    .node-state { fill: #FFFFFF; stroke: #6366F1; stroke-width: 3; }
    .line-main { stroke: #0F172A; stroke-width: 2.5; fill: none; }
    .line-branch { stroke: #4F46E5; stroke-width: 1.8; fill: none; }
    .text-math { font-family: 'Cambria Math', 'Times New Roman', serif; font-style: italic; font-size: 14px; fill: #0F172A; }
    .text-prob { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; fill: #4F46E5; font-weight: bold; }
    .title { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #64748B; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Title -->
  <text x="110" y="20" class="title">EXPECTED SARSA</text>

  <!-- Top State-Action Node (S_t, A_t) -->
  <line x1="110" y1="50" x2="110" y2="130" class="line-main" />
  <circle cx="110" cy="50" r="7" class="node-action" />
  <text x="122" y="54" class="text-math">(S<t sub="t">t</t>, A<t sub="t">t</t>)</text>

  <!-- Transition Reward R_{t+1} -->
  <text x="122" y="95" class="text-math" fill="#EF4444">R<t sub="t+1">t+1</t></text>

  <!-- State Node S_{t+1} -->
  <circle cx="110" cy="130" r="11" class="node-state" />
  <text x="126" y="134" class="text-math">S<t sub="t+1">t+1</t></text>

  <!-- Branches representing expectation over all actions -->
  <line x1="110" y1="130" x2="50" y2="200" class="line-branch" />
  <circle cx="50" cy="200" r="6" class="node-action" />
  <text x="15" y="215" class="text-prob">π(a₁|Sₜ₊₁)</text>

  <line x1="110" y1="130" x2="110" y2="210" class="line-branch" />
  <circle cx="110" cy="210" r="6" class="node-action" />
  <text x="90" y="228" class="text-prob">π(a₂|Sₜ₊₁)</text>

  <line x1="110" y1="130" x2="170" y2="200" class="line-branch" />
  <circle cx="170" cy="200" r="6" class="node-action" />
  <text x="155" y="215" class="text-prob">π(a₃|Sₜ₊₁)</text>
</svg>
