<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Arial, sans-serif">
  <rect width="800" height="400" fill="#FFFFFF"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">TD Control: SARSA vs. Q-Learning Backups</text>
  
  <!-- SARSA Section -->
  <g transform="translate(50, 60)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565C0">SARSA (On-Policy)</text>
    <!-- s,a -->
    <circle cx="150" cy="50" r="10" fill="#1565C0"/>
    <text x="170" y="55" font-size="12">s, a</text>
    <!-- r -->
    <path d="M 150 60 L 150 120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="90" font-size="11" fill="#C62828">r</text>
    <!-- s' -->
    <circle cx="150" cy="140" r="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="170" y="145" font-size="12">s'</text>
    <!-- a' -->
    <path d="M 150 150 L 150 200" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <circle cx="150" cy="210" r="10" fill="#2E7D32"/>
    <text x="170" y="215" font-size="12">a' (from current policy)</text>
    
    <text x="150" y="260" text-anchor="middle" font-size="10" font-style="italic">Updates using ACTUAL next action a'</text>
  </g>

  <!-- Q-Learning Section -->
  <g transform="translate(450, 60)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#F57F17">Q-Learning (Off-Policy)</text>
    <!-- s,a -->
    <circle cx="150" cy="50" r="10" fill="#F57F17"/>
    <text x="170" y="55" font-size="12">s, a</text>
    <!-- r -->
    <path d="M 150 60 L 150 120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="160" y="90" font-size="11" fill="#C62828">r</text>
    <!-- s' -->
    <circle cx="150" cy="140" r="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
    <text x="170" y="145" font-size="12">s'</text>
    <!-- max a' -->
    <path d="M 130 155 L 110 180 M 150 155 L 150 180 M 170 155 L 190 180" stroke="#F57F17" stroke-width="1.5"/>
    <rect x="100" y="185" width="100" height="20" rx="5" fill="#FFE0B2" stroke="#F57F17"/>
    <text x="150" y="200" text-anchor="middle" font-size="10" font-weight="bold">max Q(s', a')</text>
    
    <text x="150" y="260" text-anchor="middle" font-size="10" font-style="italic">Updates using BEST possible next action</text>
  </g>

  <!-- Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>