<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Makeup Question 3: Natural Policy Gradient Geometry &amp; Sigmoid Policy Score</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748B">Natural Gradient: F(θ)⁻¹ ∇_θ J(θ) | Sigmoid Policy: π(a₁) = σ(θ), ∇_θ ln π(a₁) = 1 - π(a₁)</text>

  <!-- Left: Riemannian Manifold vs Euclidean Space -->
  <g transform="translate(40, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Policy Distribution Manifold</text>

    <!-- Curved Riemannian Manifold -->
    <path d="M 40 180 Q 170 80 300 180" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Point θ -->
    <circle cx="170" cy="130" r="5" fill="#4F46E5"/>
    <text x="170" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#3730A3">Parameter θ</text>

    <!-- Standard Gradient Arrow (Euclidean) -->
    <path d="M 170 130 L 250 110" stroke="#EF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="235" y="100" font-size="10" font-weight="700" fill="#B91C1C">Standard ∇_θ J</text>

    <!-- Natural Gradient Arrow (Riemannian) -->
    <path d="M 170 130 L 220 160" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="215" y="180" font-size="10" font-weight="700" fill="#047857">Natural F⁻¹ ∇_θ J</text>

    <text x="170" y="222" text-anchor="middle" font-size="10" fill="#4338CA">Fisher Info Matrix F(θ) = E[ ∇lnπ (∇lnπ)ᵀ ]</text>
    <text x="170" y="238" text-anchor="middle" font-size="10" font-weight="700" fill="#3730A3">Invariant to Parameter Rescaling</text>
  </g>

  <!-- Right: Sigmoid Policy Numerical Update -->
  <g transform="translate(420, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Sigmoid Policy Update Derivation</text>

    <rect x="25" y="45" width="290" height="70" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="170" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">Action Score Formulas:</text>
    <text x="170" y="84" text-anchor="middle" font-size="11" fill="#15803D">∇_θ ln π(a₁) = 1 - π(a₁) | ∇_θ ln π(a₂) = -π(a₁)</text>

    <rect x="25" y="125" width="290" height="105" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="170" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">At Initial θ₀ = 0.0: π(a₁) = 0.5000</text>
    <text x="170" y="165" text-anchor="middle" font-size="10" fill="#92400E">Returns: G(a₁) = +4.0 | G(a₂) = +1.0</text>
    <text x="170" y="187" text-anchor="middle" font-size="11" font-weight="800" fill="#B45309">Policy Gradient: ∇_θ J(θ₀) = 0.5(2.0) - 0.5(0.5) = +0.7500</text>
    <text x="170" y="212" text-anchor="middle" font-size="12" font-weight="800" fill="#78350F">Updated Parameter θ₁ = 0.0 + 0.20(+0.75) = +0.1500</text>
  </g>

  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>
</svg>
