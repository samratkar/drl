<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Linear Semi-Gradient SARSA &amp; MSBE Double-Sample Obstacle</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748B">SARSA Tuple: (Sₜ, Aₜ, Rₜ₊₁, Sₜ₊₁, Aₜ₊₁) with Feature Approximator q̂(s,a,w) = wᵀx(s,a)</text>

  <!-- Left: SARSA Tuple Diagram -->
  <g transform="translate(40, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">On-Policy SARSA Transition</text>

    <!-- (S_t, A_t) -->
    <rect x="30" y="50" width="120" height="55" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="90" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">(Sₜ, Aₜ)</text>
    <text x="90" y="90" text-anchor="middle" font-size="10" fill="#2563EB">Feature Vector x(s,a)</text>

    <!-- Arrow with Reward R_{t+1} -->
    <path d="M 150 77 L 190 77" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="170" y="68" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">Rₜ₊₁</text>

    <!-- (S_{t+1}, A_{t+1}) -->
    <rect x="190" y="50" width="120" height="55" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="250" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">(Sₜ₊₁, Aₜ₊₁)</text>
    <text x="250" y="90" text-anchor="middle" font-size="10" fill="#15803D">Next Feature x'</text>

    <!-- Semi-gradient update box -->
    <rect x="30" y="125" width="280" height="105" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="170" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">Semi-Gradient SARSA Update Step:</text>
    <text x="170" y="165" text-anchor="middle" font-size="10" fill="#92400E">Target Uₜ = Rₜ₊₁ + γ q̂(Sₜ₊₁, Aₜ₊₁, wₜ)</text>
    <text x="170" y="185" text-anchor="middle" font-size="10" fill="#92400E">TD Error δₜ = Uₜ - q̂(Sₜ, Aₜ, wₜ)</text>
    <text x="170" y="210" text-anchor="middle" font-size="11" font-weight="800" fill="#B45309">wₜ₊₁ = wₜ + α δₜ x(Sₜ, Aₜ)</text>
  </g>

  <!-- Right: MSBE Double-Sample Obstacle -->
  <g transform="translate(420, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#991B1B">The Double-Sample Obstacle</text>

    <!-- State S_t -->
    <circle cx="170" cy="60" r="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="170" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">Sₜ</text>

    <!-- 2 Sample transitions -->
    <path d="M 158 72 L 100 120" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="115" y="92" text-anchor="middle" font-size="9" fill="#991B1B">Sample 1: S'₁</text>

    <path d="M 182 72 L 240 120" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="225" y="92" text-anchor="middle" font-size="9" fill="#991B1B">Sample 2: S'₂</text>

    <!-- Branch Nodes -->
    <circle cx="100" cy="132" r="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="100" y="136" text-anchor="middle" font-size="9" fill="#991B1B">S'₁</text>

    <circle cx="240" cy="132" r="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="240" y="136" text-anchor="middle" font-size="9" fill="#991B1B">S'₂</text>

    <!-- Explanation Card -->
    <rect x="20" y="160" width="300" height="75" rx="6" fill="#FEF2F2" stroke="#F87171" stroke-width="1"/>
    <text x="170" y="178" text-anchor="middle" font-size="10" font-weight="700" fill="#991B1B">Why MSBE Requires 2 Samples:</text>
    <text x="170" y="196" text-anchor="middle" font-size="9" fill="#B91C1C">∇ MSBE(w) = -2 E[δₜ] · E[γ∇v̂' - ∇v̂]</text>
    <text x="170" y="212" text-anchor="middle" font-size="9" fill="#B91C1C">Product of expectations ⟹ 2 independent transitions</text>
    <text x="170" y="226" text-anchor="middle" font-size="9" font-weight="700" fill="#7F1D1D">Resolved by GTD2 / TDC dual-weight architecture!</text>
  </g>

  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
  </defs>
</svg>
