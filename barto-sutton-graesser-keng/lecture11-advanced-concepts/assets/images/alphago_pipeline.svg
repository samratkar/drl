<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" style="background-color: #ffffff; border-radius: 8px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="0" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .section-title { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
    .box-title { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .box-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; fill: #f1f5f9; text-anchor: middle; }
    .data-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 600; fill: #475569; text-anchor: middle; }
    .flow-label { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 600; fill: #64748b; }
    .pipeline-step { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #1e293b; }
  </style>

  <!-- STEP 1: SUPERVISED LEARNING -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="840" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2" stroke-width="1.5" />
    <text x="15" y="25" class="pipeline-step" style="fill:#3b82f6">STAGE 1: Supervised Learning (SL)</text>
    
    <!-- Human Expert Data -->
    <rect x="30" y="45" width="130" height="45" rx="6" fill="#e2e8f0" stroke="#cbd5e1" />
    <text x="95" y="62" class="data-text" style="fill:#1e293b">KGS Go Server Data</text>
    <text x="95" y="77" class="data-text" style="font-weight:400; font-size:8px;">30 Million Positions</text>

    <line x1="160" y1="67" x2="220" y2="67" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="190" y="60" class="flow-label" style="text-anchor:middle;">Train</text>

    <!-- SL Policy Network -->
    <rect x="230" y="45" width="180" height="50" rx="6" fill="url(#blueGrad)" filter="url(#shadow)" />
    <text x="320" y="65" class="box-title">SL Policy Network (π_SL)</text>
    <text x="320" y="80" class="box-desc">Predicts human moves (Acc: 57%)</text>

    <!-- Fast Rollout Policy -->
    <rect x="520" y="45" width="180" height="50" rx="6" fill="url(#purpleGrad)" filter="url(#shadow)" />
    <text x="610" y="65" class="box-title">Rollout Policy (π_rollout)</text>
    <text x="610" y="80" class="box-desc">Linear softmax (2 μs, Acc: 24%)</text>

    <line x1="160" y1="67" x2="230" y2="67" stroke="#64748b" stroke-width="1.5" />
    <path d="M 120 45 Q 120 15 500 15 T 610 45" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <text x="360" y="25" class="flow-label">Heuristic / Local Patterns</text>
  </g>

  <!-- STEP 2: REINFORCEMENT LEARNING -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="840" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2" stroke-width="1.5" />
    <text x="15" y="25" class="pipeline-step" style="fill:#f97316">STAGE 2: Reinforcement Learning (RL)</text>
    
    <!-- Link from SL Policy -->
    <path d="M 320 -30 Q 320 0 120 10 T 120 50" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)" />
    <text x="210" y="10" class="flow-label" style="fill:#3b82f6;">Initialize weights</text>

    <!-- RL Policy Network -->
    <rect x="30" y="50" width="180" height="50" rx="6" fill="url(#orangeGrad)" filter="url(#shadow)" />
    <text x="120" y="70" class="box-title">RL Policy Network (π_RL)</text>
    <text x="120" y="85" class="box-desc">Policy Gradient (Self-Play)</text>

    <!-- Self-Play Loop -->
    <path d="M 210 75 C 260 95 260 55 220 58" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="255" y="75" class="flow-label" style="fill:#ea580c;">Self-Play</text>

    <line x1="210" y1="75" x2="350" y2="75" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="280" y="68" class="flow-label" style="text-anchor:middle;">Generate</text>

    <!-- Self-Play Dataset -->
    <rect x="360" y="50" width="160" height="50" rx="6" fill="#e2e8f0" stroke="#cbd5e1" />
    <text x="440" y="70" class="data-text" style="fill:#1e293b">Self-Play Dataset</text>
    <text x="440" y="85" class="data-text" style="font-weight:400; font-size:8px;">Uncorrelated State-Outcome Pairs</text>
  </g>

  <!-- STEP 3: VALUE NETWORK -->
  <g transform="translate(30, 310)">
    <rect x="0" y="0" width="840" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="2 2" stroke-width="1.5" />
    <text x="15" y="25" class="pipeline-step" style="fill:#14b8a6">STAGE 3: Value Network (v_θ)</text>
    
    <!-- Link from Self-Play Dataset -->
    <path d="M 440 -50 L 440 45" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="450" y="5" class="flow-label">Regression Target</text>

    <!-- Value Network -->
    <rect x="350" y="45" width="180" height="50" rx="6" fill="url(#tealGrad)" filter="url(#shadow)" />
    <text x="440" y="65" class="box-title">Value Network (v_θ)</text>
    <text x="440" y="80" class="box-desc">Predicts winner from state s</text>
  </g>

  <!-- SUMMARY LEGEND -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="160" height="100" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="80" y="20" class="pipeline-step" style="text-anchor:middle; font-size:10px;">Role in MCTS Playout</text>
    <line x1="10" y1="30" x2="150" y2="30" stroke="#f1f5f9" stroke-width="1.5" />
    
    <circle cx="20" cy="45" r="5" fill="url(#blueGrad)" />
    <text x="35" y="48" font-family="Inter" font-size="8px" font-weight="600" fill="#334155">π_SL : Prior Probabilities P(s,a)</text>

    <circle cx="20" cy="65" r="5" fill="url(#tealGrad)" />
    <text x="35" y="68" font-family="Inter" font-size="8px" font-weight="600" fill="#334155">v_θ : Node Evaluation V(s)</text>

    <circle cx="20" cy="85" r="5" fill="url(#purpleGrad)" />
    <text x="35" y="88" font-family="Inter" font-size="8px" font-weight="600" fill="#334155">π_rollout : Fast simulation</text>
  </g>
</svg>
