<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%" style="background-color: #ffffff; border-radius: 8px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="azGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="mzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <linearGradient id="latentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <drop-shadow dx="0" dy="3" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <style>
    .header-text { font-family: 'Inter', system-ui, sans-serif; font-size: 16px; font-weight: 800; fill: #0f172a; }
    .sub-header { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
    .box-title { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .box-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; fill: #1e293b; font-weight: 600; text-anchor: middle; }
    .label-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .flow-text { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; font-weight: 600; fill: #0f172a; }
    .math-expr { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #1e293b; font-weight: 600; }
    rect[fill="url(#azGrad)"] { stroke: #3b82f6; stroke-width: 1.5px; }
    rect[fill="url(#mzGrad)"] { stroke: #8b5cf6; stroke-width: 1.5px; }
    rect[fill="url(#latentGrad)"] { stroke: #14b8a6; stroke-width: 1.5px; }
    rect[fill="url(#envGrad)"] { stroke: #f59e0b; stroke-width: 1.5px; }
  </style>

  <!-- Title -->
  <text x="30" y="30" class="header-text">Planning Architectures: AlphaZero vs. MuZero</text>

  <!-- ==================== ALPHAZERO SECTION ==================== -->
  <g transform="translate(30, 50)">
    <!-- Section Border -->
    <rect x="0" y="0" width="890" height="175" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="22" class="header-text" style="font-size:12px; fill:#1d4ed8;">AlphaZero: Planning with a Known Simulator (Rules-based)</text>
    <text x="15" y="36" class="sub-header">Requires a simulator to transition states. Search tree contains exact game states.</text>

    <!-- State Transition Flow -->
    <!-- Current State -->
    <rect x="30" y="65" width="130" height="40" rx="6" fill="url(#envGrad)" filter="url(#shadow)" />
    <text x="95" y="82" class="box-title">Real State s</text>
    <text x="95" y="94" class="box-desc">Board coordinates</text>

    <!-- Simulator -->
    <rect x="230" y="65" width="150" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <text x="305" y="82" class="label-text" style="fill:#1e293b">Simulator (Rules of Go/Chess)</text>
    <text x="305" y="94" class="flow-text" style="font-size:8px; fill:#475569; text-anchor:middle;">Known transition function P(s'|s,a)</text>

    <!-- Next State -->
    <rect x="440" y="65" width="130" height="40" rx="6" fill="url(#envGrad)" filter="url(#shadow)" />
    <text x="505" y="82" class="box-title">Next State s'</text>
    <text x="505" y="94" class="box-desc">Deterministic next board</text>

    <!-- Connections -->
    <line x1="160" y1="85" x2="220" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="190" y="77" class="flow-text" style="text-anchor:middle;">Action a</text>
    
    <line x1="380" y1="85" x2="430" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Evaluation (Neural Network) -->
    <rect x="640" y="65" width="220" height="85" rx="6" fill="url(#azGrad)" filter="url(#shadow)" />
    <text x="750" y="85" class="box-title">Neural Network f_θ(s)</text>
    <text x="750" y="105" class="box-desc">Outputs Policy and Value jointly</text>
    <line x1="650" y1="115" x2="850" y2="115" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1" />
    <text x="750" y="132" class="box-title" style="font-size:10px; font-weight:700; fill:#1d4ed8;">p, v = f_θ(s)</text>


    <path x="570" y="85" d="M 505 105 Q 505 130 580 130 T 630 115" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    <text x="550" y="145" class="flow-text" style="font-size:8px;">Evaluate s'</text>
  </g>

  <!-- ==================== MUZERO SECTION ==================== -->
  <g transform="translate(30, 245)">
    <!-- Section Border -->
    <rect x="0" y="0" width="890" height="205" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="15" y="22" class="header-text" style="font-size:12px; fill:#6d28d9;">MuZero: Planning in a Learned Latent Space (Model-free / Unknown Rules)</text>
    <text x="15" y="36" class="sub-header">No simulator. Learns to embed states and predict transitions, rewards, and outcomes inside a latent space.</text>

    <!-- Representation -->
    <rect x="20" y="60" width="130" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" />
    <text x="85" y="75" class="label-text" style="fill:#1e293b">Observations</text>
    <text x="85" y="90" class="flow-text" style="font-size:8px; text-anchor:middle;">o_1, o_2, ..., o_t</text>

    <!-- Representation Network h -->
    <rect x="185" y="60" width="110" height="40" rx="6" fill="url(#mzGrad)" filter="url(#shadow)" />
    <text x="240" y="77" class="box-title">Representation h_θ</text>
    <text x="240" y="90" class="box-desc">s^0 = h_θ(o_1..t)</text>

    <!-- Latent State s^0 -->
    <rect x="330" y="60" width="100" height="40" rx="6" fill="url(#latentGrad)" filter="url(#shadow)" />
    <text x="380" y="77" class="box-title">Latent State s^0</text>
    <text x="380" y="90" class="box-desc">(Internal Embedding)</text>

    <!-- Dynamics Network g -->
    <rect x="475" y="60" width="110" height="40" rx="6" fill="url(#mzGrad)" filter="url(#shadow)" />
    <text x="530" y="77" class="box-title">Dynamics g_θ</text>
    <text x="530" y="90" class="box-desc">s^k, r^k = g_θ(s^k-1, a)</text>

    <!-- Next Latent State s^k -->
    <rect x="620" y="60" width="100" height="40" rx="6" fill="url(#latentGrad)" filter="url(#shadow)" />
    <text x="670" y="77" class="box-title">Latent State s^k</text>
    <text x="670" y="90" class="box-desc">Imagined State</text>

    <!-- Prediction Network f -->
    <rect x="760" y="60" width="110" height="55" rx="6" fill="url(#mzGrad)" filter="url(#shadow)" />
    <text x="815" y="75" class="box-title">Prediction f_θ</text>
    <text x="815" y="88" class="box-desc">p^k, v^k = f_θ(s^k)</text>
    <line x1="770" y1="95" x2="860" y2="95" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
    <text x="815" y="107" class="box-desc" style="font-weight:700; fill:#6d28d9;">Policy &amp; Value Head</text>


    <!-- Connections -->
    <line x1="150" y1="80" x2="180" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="295" y1="80" x2="325" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    
    <line x1="430" y1="80" x2="470" y2="80" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <text x="450" y="72" class="flow-text" style="text-anchor:middle;">Action a</text>

    <line x1="585" y1="80" x2="615" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="600" y="105" class="flow-text" style="fill:#10b981; font-weight:700; text-anchor:middle;">r^k (Reward)</text>

    <path d="M 670 100 Q 670 135 710 135 T 760 100" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 380 100 Q 380 160 570 160 T 755 100" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" />
    
    <!-- Explanatory Box -->
    <rect x="20" y="130" width="310" height="60" rx="4" fill="#ffffff" stroke="#e2e8f0" />
    <text x="30" y="145" class="math-expr" style="font-weight:700; fill:#6d28d9;">MuZero Model Components:</text>
    <text x="30" y="162" class="math-expr">1. Representation: h(o_1..t) -> s_0</text>
    <text x="30" y="177" class="math-expr">2. Dynamics: g(s_{k-1}, a_k) -> (s_k, r_k)</text>
    <text x="195" y="177" class="math-expr">3. Prediction: f(s_k) -> (p_k, v_k)</text>
  </g>
</svg>
