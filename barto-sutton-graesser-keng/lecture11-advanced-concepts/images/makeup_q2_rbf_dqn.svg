<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Makeup Question 2: Gaussian RBF Feature Space &amp; DQN Stabilization Mechanisms</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748B">Left: 2 Gaussian RBFs (c₁=-1, c₂=+1, σ=1.0). Right: Experience Replay &amp; Target Network (w⁻)</text>

  <!-- Left: RBF Curves -->
  <g transform="translate(40, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Gaussian RBF Features ϕ₁(s) &amp; ϕ₂(s)</text>

    <!-- Axes -->
    <line x1="30" y1="190" x2="310" y2="190" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="170" y="210" text-anchor="middle" font-size="11" fill="#475569">1D State Space s ∈ [-2.0, +2.0]</text>

    <!-- RBF 1 Curve (c1 = -1) -->
    <path d="M 40 188 Q 110 50 180 140 T 300 189" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <text x="100" y="70" font-size="11" font-weight="700" fill="#1D4ED8">ϕ₁(s) [c₁=-1]</text>

    <!-- RBF 2 Curve (c2 = +1) -->
    <path d="M 40 189 Q 160 140 230 50 T 300 188" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <text x="240" y="70" font-size="11" font-weight="700" fill="#047857">ϕ₂(s) [c₂=+1]</text>

    <!-- Numerical Feature Values at s=0 -->
    <line x1="170" y1="50" x2="170" y2="190" stroke="#64748B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="170" cy="115" r="4" fill="#64748B"/>
    <text x="170" y="232" text-anchor="middle" font-size="11" font-weight="800" fill="#0F172A">At s=0: x(0) = [ 0.6065, 0.6065 ]ᵀ</text>
  </g>

  <!-- Right: DQN Stabilization Mechanisms -->
  <g transform="translate(420, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">DQN Stabilization Innovations</text>

    <!-- Replay Buffer Box -->
    <rect x="25" y="45" width="290" height="85" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="170" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">1. Experience Replay Buffer (D)</text>
    <text x="170" y="84" text-anchor="middle" font-size="10" fill="#2563EB">Stores (Sₜ, Aₜ, Rₜ₊₁, Sₜ₊₁) transitions</text>
    <text x="170" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#1D4ED8">Breaks temporal correlations → satisfies i.i.d. SGD</text>

    <!-- Target Network Box -->
    <rect x="25" y="145" width="290" height="85" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="170" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">2. Target Network (w⁻)</text>
    <text x="170" y="184" text-anchor="middle" font-size="10" fill="#059669">TD Target: Yₜ = R + γ max_{a'} q̂(S', a', w⁻)</text>
    <text x="170" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Freezes target for C steps → prevents target chasing</text>
  </g>
</svg>
