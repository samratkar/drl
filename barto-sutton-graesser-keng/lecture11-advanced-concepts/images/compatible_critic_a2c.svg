<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Compatible Function Approximation &amp; Multi-Step A2C</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748B">Zero Bias Condition: ∇_w Q_w(s,a) = ∇_θ ln π_θ(a|s) | Multi-Step Advantage Â₀⁽ᵏ⁾ = G₀:ₖ - v̂(S₀)</text>

  <!-- Left: Compatible Critic Box -->
  <g transform="translate(40, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Compatible Critic Theorem</text>

    <rect x="25" y="45" width="290" height="180" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="35" y="66" font-size="11" font-weight="700" fill="#1E40AF">Two Necessary Conditions:</text>

    <text x="35" y="88" font-size="10" font-weight="700" fill="#1D4ED8">1. Feature Compatibility Condition:</text>
    <text x="35" y="105" font-size="10" font-weight="800" font-family="Courier New, monospace" fill="#1E3A8A">∇_w Q_w(s,a) = ∇_θ ln π_θ(a|s)</text>

    <text x="35" y="130" font-size="10" font-weight="700" fill="#1D4ED8">2. Mean Squared Error Minimization:</text>
    <text x="35" y="147" font-size="10" font-weight="800" font-family="Courier New, monospace" fill="#1E3A8A">w* = argmin_w E[ (Q^π(s,a) - Q_w(s,a))² ]</text>

    <line x1="35" y1="165" x2="305" y2="165" stroke="#93C5FD" stroke-width="1"/>
    <text x="35" y="185" font-size="10" font-weight="700" fill="#047857">✓ Substitutes Q_w for Q^π with ZERO BIAS</text>
    <text x="35" y="202" font-size="10" font-weight="700" fill="#047857">✓ Critic parameterization: Q_w(s,a) = wᵀ ∇_θ ln π</text>
  </g>

  <!-- Right: Multi-Step Advantage Horizon Box -->
  <g transform="translate(420, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Multi-Step Advantage Trade-off</text>

    <!-- 1-Step Box -->
    <rect x="25" y="45" width="290" height="55" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="35" y="66" font-size="10" font-weight="700" fill="#14532D">1-Step Horizon (k = 1):</text>
    <text x="35" y="85" font-size="10" font-family="Courier New, monospace" fill="#15803D">G₀:₁ = R₁ + γ v̂(S₁)  ⟹ High Bias, Low Variance</text>

    <!-- 3-Step Box -->
    <rect x="25" y="110" width="290" height="55" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="35" y="131" font-size="10" font-weight="700" fill="#78350F">3-Step Horizon (k = 3):</text>
    <text x="35" y="150" font-size="10" font-family="Courier New, monospace" fill="#B45309">G₀:₃ = R₁ + γR₂ + γ²R₃ + γ³v̂(S₃) ⟹ Lower Bias</text>

    <!-- Trade-off Summary -->
    <rect x="25" y="175" width="290" height="50" rx="6" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <text x="170" y="195" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">Bias-Variance Continuum:</text>
    <text x="170" y="212" text-anchor="middle" font-size="9" fill="#475569">As k ↑ : Critic Bias Decreases | Sample Variance Increases</text>
  </g>
</svg>
