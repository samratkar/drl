<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="360" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1E293B">Makeup Question 4: Compatible Critic Theorem &amp; Multi-Step A2C Trade-off</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#64748B">Left: Compatible Critic ∇_w Q_w = ∇_θ ln π. Right: k-Step Advantage (k=1: Â₀=1.70 vs k=3: Â₀=9.87)</text>

  <!-- Left: Compatible Critic Theorem -->
  <g transform="translate(40, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Compatible Function Approximation</text>

    <rect x="25" y="45" width="290" height="75" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
    <text x="170" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#14532D">1. Compatibility Condition:</text>
    <text x="170" y="86" text-anchor="middle" font-size="11" font-weight="800" fill="#15803D">∇_w Q_w(s,a) = ∇_θ ln π_θ(a|s)</text>

    <rect x="25" y="135" width="290" height="75" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="170" y="155" text-anchor="middle" font-size="11" font-weight="700" fill="#1E40AF">2. MSE Critic Optimization:</text>
    <text x="170" y="176" text-anchor="middle" font-size="11" font-weight="800" fill="#1D4ED8">w* = argmin_w E [ (Q^{π}(s,a) - Q_w(s,a))² ]</text>

    <text x="170" y="232" text-anchor="middle" font-size="11" font-weight="800" fill="#059669">Guarantees EXACT Zero Bias in Policy Gradient!</text>
  </g>

  <!-- Right: Multi-Step A2C Advantage -->
  <g transform="translate(420, 75)">
    <rect width="340" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="170" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">Multi-Step A2C Advantage (γ = 0.90)</text>

    <!-- 1-step box -->
    <rect x="25" y="45" width="135" height="90" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <text x="92" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#78350F">1-Step Horizon (k=1)</text>
    <text x="92" y="84" text-anchor="middle" font-size="10" fill="#92400E">G₀:₁ = R₁ + γ v̂(S₁)</text>
    <text x="92" y="100" text-anchor="middle" font-size="10" fill="#92400E">= 1.0 + 0.9(3.0) = 3.70</text>
    <text x="92" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="#B45309">Â₀⁽¹⁾ = +1.7000</text>

    <!-- 3-step box -->
    <rect x="180" y="45" width="135" height="90" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="247" y="65" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">3-Step Horizon (k=3)</text>
    <text x="247" y="84" text-anchor="middle" font-size="10" fill="#059669">G₀:₃ = R₁+γR₂+γ²R₃+γ³v̂₃</text>
    <text x="247" y="100" text-anchor="middle" font-size="10" fill="#059669">= 1+1.8+3.24+5.83 = 11.87</text>
    <text x="247" y="120" text-anchor="middle" font-size="11" font-weight="800" fill="#047857">Â₀⁽³⁾ = +9.8720</text>

    <!-- Bias Variance summary -->
    <rect x="25" y="150" width="290" height="75" rx="6" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <text x="170" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Trade-off as Step Horizon k Increases:</text>
    <text x="170" y="188" text-anchor="middle" font-size="10" fill="#059669" font-weight="700">✓ Bias Decreases (less reliance on approximate critic v̂)</text>
    <text x="170" y="206" text-anchor="middle" font-size="10" fill="#DC2626" font-weight="700">✗ Variance Increases (accumulates multi-step noise)</text>
  </g>
</svg>
