<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="600" height="350" fill="#fcfcfc" rx="8" ry="8" stroke="#dee2e6" stroke-width="1"/>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#333"/>
    </marker>
  </defs>

  <text x="300" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">PPO Clipped Surrogate Objective</text>

  <!-- Shaded Trust Region -->
  <rect x="200" y="50" width="200" height="250" fill="#3182ce" fill-opacity="0.06" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="300" y="65" font-family="Arial, sans-serif" font-size="11" fill="#4a5568" font-weight="bold" text-anchor="middle">Trust Region (r_t within [1-eps, 1+eps])</text>

  <!-- Axes -->
  <line x1="100" y1="250" x2="500" y2="250" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="300" x2="300" y2="50" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="520" y="255" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">r_t(theta)</text>
  <text x="300" y="320" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Probability Ratio = pi_new / pi_old</text>
  
  <text x="65" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle" transform="rotate(-90 65 175)">Objective Value L^CLIP(theta)</text>

  <!-- Center line (r_t = 1) -->
  <circle cx="300" cy="250" r="4" fill="#333"/>
  <text x="290" y="268" font-family="Arial, sans-serif" font-size="12">1.0</text>

  <!-- 1 - eps -->
  <line x1="200" y1="245" x2="200" y2="255" stroke="#333" stroke-width="2"/>
  <text x="170" y="270" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c" font-weight="bold">1 - epsilon (0.8)</text>

  <!-- 1 + eps -->
  <line x1="400" y1="245" x2="400" y2="255" stroke="#333" stroke-width="2"/>
  <text x="380" y="270" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">1 + epsilon (1.2)</text>

  <!-- Scenario 1: Advantage > 0 -->
  <text x="440" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2980b9" text-anchor="middle">A &gt; 0 (Good Action)</text>
  <!-- Unclipped line -->
  <line x1="100" y1="350" x2="500" y2="150" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="5,5"/>
  <!-- Clipped line -->
  <path d="M 100 350 L 400 200 L 500 200" fill="none" stroke="#2980b9" stroke-width="3.5"/>
  <text x="445" y="190" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2980b9">Clipped</text>

  <!-- Scenario 2: Advantage < 0 -->
  <text x="160" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#e67e22" text-anchor="middle">A &lt; 0 (Bad Action)</text>
  <!-- Unclipped line -->
  <line x1="100" y1="150" x2="500" y2="350" stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="5,5"/>
  <!-- Clipped line -->
  <path d="M 100 150 L 200 200 L 500 350" fill="none" stroke="#e67e22" stroke-width="3.5"/>
  <text x="145" y="180" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#e67e22">Clipped</text>
</svg>