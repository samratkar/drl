<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 550" width="100%" height="550">
  <rect width="450" height="550" fill="#f8fafc" rx="8" ry="8" stroke="#dee2e6" stroke-width="1"/>
  
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L5,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="225" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#2d3748" text-anchor="middle">PPO End-to-End Data Flow</text>

  <!-- ================= PHASE 1: ROLLOUT ================= -->
  <rect x="15" y="55" width="420" height="135" fill="#ebf8ff" rx="6" ry="6" stroke="#bee3f8" stroke-width="1.5"/>
  <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#2b6cb0">Phase 1: Rollout &amp; Data Collection</text>
  
  <!-- Gym Env Box -->
  <rect x="30" y="95" width="90" height="40" fill="#ffffff" rx="4" ry="4" stroke="#3182ce" stroke-width="1.5"/>
  <text x="75" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Gym Env</text>
  
  <!-- Actor Net Box -->
  <rect x="180" y="95" width="90" height="40" fill="#ffffff" rx="4" ry="4" stroke="#3182ce" stroke-width="1.5"/>
  <text x="225" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2b6cb0" text-anchor="middle">Actor Policy</text>

  <!-- Rollout Buffer -->
  <rect x="330" y="95" width="90" height="80" fill="#ffffff" rx="4" ry="4" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2d3748" text-anchor="middle">Rollout Buffers</text>
  <text x="375" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#718096" text-anchor="middle">states, actions,</text>
  <text x="375" y="147" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#718096" text-anchor="middle">rewards, dones,</text>
  <text x="375" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#718096" text-anchor="middle">log_probs</text>

  <!-- Arrows inside Phase 1 -->
  <path d="M 120 105 L 180 105" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">state</text>
  
  <path d="M 225 135 L 225 155 L 75 155 L 75 135" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="150" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#4a5568" text-anchor="middle">action</text>

  <path d="M 270 115 L 330 115" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 2: GAE ================= -->
  <rect x="15" y="205" width="420" height="135" fill="#fffaf0" rx="6" ry="6" stroke="#fde8bb" stroke-width="1.5"/>
  <text x="30" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#dd6b20">Phase 2: GAE &amp; Return Targets</text>

  <!-- Inputs from Buffer -->
  <rect x="30" y="245" width="90" height="40" fill="#ffffff" rx="4" ry="4" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="75" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">Rewards, Dones,</text>
  <text x="75" y="276" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">Critic Values V(s)</text>

  <!-- GAE computation box -->
  <rect x="180" y="245" width="90" height="40" fill="#ffffff" rx="4" ry="4" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="225" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#c05621" text-anchor="middle">GAE Formulas</text>

  <!-- Output targets -->
  <rect x="330" y="245" width="90" height="80" fill="#ffffff" rx="4" ry="4" stroke="#4a5568" stroke-width="1.5"/>
  <text x="375" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2d3748" text-anchor="middle">Calculated</text>
  <text x="375" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2d3748" text-anchor="middle">Targets</text>
  <text x="375" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e67e22" font-weight="bold" text-anchor="middle">Advantages</text>
  <text x="375" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#e67e22" font-weight="bold" text-anchor="middle">Returns</text>

  <!-- Arrows inside Phase 2 -->
  <path d="M 120 265 L 180 265" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 270 265 L 330 265" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ================= PHASE 3: PPO UPDATE ================= -->
  <rect x="15" y="355" width="420" height="155" fill="#f0fff4" rx="6" ry="6" stroke="#c6f6d5" stroke-width="1.5"/>
  <text x="30" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38a169">Phase 3: Multi-Epoch SGD Update</text>

  <!-- Mini-batch selector -->
  <rect x="30" y="395" width="90" height="40" fill="#ffffff" rx="4" ry="4" stroke="#38a169" stroke-width="1.5"/>
  <text x="75" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#276749" text-anchor="middle">Mini-batch</text>
  <text x="75" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#276749" text-anchor="middle">Shuffling</text>

  <!-- PPO update step -->
  <rect x="180" y="395" width="90" height="60" fill="#ffffff" rx="4" ry="4" stroke="#38a169" stroke-width="1.5"/>
  <text x="225" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#276749" text-anchor="middle">Clipped Loss</text>
  <text x="225" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#276749" text-anchor="middle">&amp; Value MSE</text>
  <text x="225" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#276749" text-anchor="middle">Optimization</text>

  <!-- Networks weights update -->
  <rect x="330" y="395" width="90" height="40" fill="#38a169" rx="4" ry="4" stroke="#276749" stroke-width="1.5"/>
  <text x="375" y="414" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Update Weights</text>
  <text x="375" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">θ and w</text>

  <!-- Arrows inside Phase 3 -->
  <path d="M 120 415 L 180 415" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 270 415 L 330 415" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Vertical Phase Transitions -->
  <path d="M 225 190 L 225 200" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 225 340 L 225 350" fill="none" stroke="#718096" stroke-width="1.2" marker-end="url(#arrow)"/>
</svg>
