<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="6" />

  <!-- Title -->
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Numerical Example of Tile Coding (3 Offsetting Grids)</text>
  <text x="20" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Visualizing active tiles and their intersection for state s = (2.2, 1.7)</text>

  <!-- Transform group for coordinate scaling and positioning -->
  <!-- Origin (0.0, 0.0) is mapped to screen coordinate (120, 280) -->
  <!-- 1.0 grid unit = 80 pixels -->
  <g transform="translate(10, 20)">
    
    <!-- Shading Active Tiles -->
    <!-- Tiling 1: Active Tile (1, 0) -> x: [2.0, 4.0], y: [0.0, 2.0] -> Screen [280, 120] to [440, 280] -->
    <rect x="280" y="120" width="160" height="160" fill="#ef4444" fill-opacity="0.06" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Tiling 2: Active Tile (0, 0) -> x: [0.5, 2.5], y: [0.5, 2.5] -> Screen [160, 80] to [320, 240] -->
    <rect x="160" y="80" width="160" height="160" fill="#3b82f6" fill-opacity="0.06" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="2,2" />

    <!-- Tiling 3: Active Tile (0, 0) -> x: [1.0, 3.0], y: [1.0, 3.0] -> Screen [200, 40] to [360, 200] -->
    <rect x="200" y="40" width="160" height="160" fill="#10b981" fill-opacity="0.06" stroke="#10b981" stroke-width="1.5" stroke-dasharray="1,1" />

    <!-- Intersection Area (Purple) -->
    <!-- Overlap: x: [2.0, 2.5] (Screen 280 to 320), y: [1.0, 2.0] (Screen 120 to 200) -->
    <rect x="280" y="120" width="40" height="80" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="2" />

    <!-- Tiling 1 Grid Lines (Solid Light Gray) -->
    <!-- Vertical -->
    <line x1="120" y1="20" x2="120" y2="340" stroke="#cbd5e1" stroke-width="1" />
    <line x1="280" y1="20" x2="280" y2="340" stroke="#cbd5e1" stroke-width="1" />
    <line x1="440" y1="20" x2="440" y2="340" stroke="#cbd5e1" stroke-width="1" />
    <!-- Horizontal -->
    <line x1="40" y1="280" x2="440" y2="280" stroke="#cbd5e1" stroke-width="1" />
    <line x1="40" y1="120" x2="440" y2="120" stroke="#cbd5e1" stroke-width="1" />

    <!-- Tiling 2 Grid Lines (Dashed Blue, Origin at 0.5, 0.5 -> screen 160, 240) -->
    <!-- Vertical -->
    <line x1="160" y1="20" x2="160" y2="340" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="320" y1="20" x2="320" y2="340" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,4" />
    <!-- Horizontal -->
    <line x1="40" y1="240" x2="440" y2="240" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="40" y1="80"  x2="440" y2="80"  stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Tiling 3 Grid Lines (Dotted Green, Origin at 1.0, 1.0 -> screen 200, 200) -->
    <!-- Vertical -->
    <line x1="200" y1="20" x2="200" y2="340" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="360" y1="20" x2="360" y2="340" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="2,2" />
    <!-- Horizontal -->
    <line x1="40" y1="200" x2="440" y2="200" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="40" y1="40"  x2="440" y2="40"  stroke="#a7f3d0" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Main Cartesian Axes -->
    <line x1="40" y1="280" x2="445" y2="280" stroke="#1e293b" stroke-width="2" /> <!-- X axis -->
    <line x1="120" y1="20" x2="120" y2="345" stroke="#1e293b" stroke-width="2" /> <!-- Y axis -->

    <!-- Tick labels for X-axis -->
    <text x="120" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#475569">0.0</text>
    <text x="160" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#3b82f6">0.5</text>
    <text x="200" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#10b981">1.0</text>
    <text x="280" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#475569">2.0</text>
    <text x="320" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#3b82f6">2.5</text>
    <text x="360" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#10b981">3.0</text>
    <text x="440" y="295" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#475569">4.0</text>
    <text x="440" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="start"> X</text>

    <!-- Tick labels for Y-axis -->
    <text x="112" y="283" font-family="sans-serif" font-size="9" text-anchor="end" fill="#475569">0.0</text>
    <text x="112" y="243" font-family="sans-serif" font-size="9" text-anchor="end" fill="#3b82f6">0.5</text>
    <text x="112" y="203" font-family="sans-serif" font-size="9" text-anchor="end" fill="#10b981">1.0</text>
    <text x="112" y="123" font-family="sans-serif" font-size="9" text-anchor="end" fill="#475569">2.0</text>
    <text x="112" y="83"  font-family="sans-serif" font-size="9" text-anchor="end" fill="#3b82f6">2.5</text>
    <text x="112" y="43"  font-family="sans-serif" font-size="9" text-anchor="end" fill="#10b981">3.0</text>
    <text x="125" y="26"  font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Y</text>

    <!-- State point s = (2.2, 1.7) -> screen (296, 144) -->
    <circle cx="296" cy="144" r="5" fill="#8b5cf6" stroke="#4c1d95" stroke-width="1.5" />
    <text x="306" y="148" font-family="sans-serif" font-size="10" font-weight="bold" fill="#4c1d95">s (2.2, 1.7)</text>

    <!-- Pointer pointing to the overlap region -->
    <path d="M 230,160 L 278,160" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2,2" />
    <text x="225" y="163" font-family="sans-serif" font-size="9" font-weight="bold" fill="#8b5cf6" text-anchor="end">Active Intersection</text>
    <text x="225" y="173" font-family="sans-serif" font-size="8" fill="#6d28d9" text-anchor="end">x: [2.0, 2.5], y: [1.0, 2.0]</text>
  </g>

  <!-- Legend Box (Placed on the right side) -->
  <g transform="translate(440, 50)">
    <rect x="0" y="0" width="100" height="280" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="10" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Legend</text>
    
    <!-- Tiling 1 -->
    <line x1="10" y1="38" x2="30" y2="38" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="35" y="41" font-family="sans-serif" font-size="8" fill="#475569">Tiling 1 Grid</text>
    <rect x="10" y="48" width="12" height="12" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" />
    <text x="28" y="57" font-family="sans-serif" font-size="8" fill="#ef4444">Tile (1, 0) index 1</text>

    <!-- Tiling 2 -->
    <line x1="10" y1="83" x2="30" y2="83" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="35" y="86" font-family="sans-serif" font-size="8" fill="#475569">Tiling 2 Grid</text>
    <rect x="10" y="93" width="12" height="12" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" />
    <text x="28" y="102" font-family="sans-serif" font-size="8" fill="#3b82f6">Tile (0, 0) index 16</text>

    <!-- Tiling 3 -->
    <line x1="10" y1="128" x2="30" y2="128" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="35" y="131" font-family="sans-serif" font-size="8" fill="#475569">Tiling 3 Grid</text>
    <rect x="10" y="138" width="12" height="12" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2" />
    <text x="28" y="147" font-family="sans-serif" font-size="8" fill="#10b981">Tile (0, 0) index 32</text>

    <!-- Intersection -->
    <rect x="10" y="175" width="12" height="12" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="28" y="184" font-family="sans-serif" font-size="8" fill="#8b5cf6" font-weight="bold">Intersection</text>
    <text x="28" y="194" font-family="sans-serif" font-size="7" fill="#6d28d9">Resolution</text>

    <!-- State -->
    <circle cx="16" cy="220" r="4" fill="#8b5cf6" stroke="#4c1d95" stroke-width="1" />
    <text x="28" y="223" font-family="sans-serif" font-size="8" fill="#475569">s (2.2, 1.7)</text>

    <!-- Info -->
    <text x="10" y="250" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold">Tile Size:</text>
    <text x="10" y="260" font-family="sans-serif" font-size="7" fill="#64748b">2.0 x 2.0 units</text>
    <text x="10" y="270" font-family="sans-serif" font-size="8" fill="#64748b" font-weight="bold">Offsets:</text>
    <text x="10" y="280" font-family="sans-serif" font-size="7" fill="#64748b">(0.5, 0.5) steps</text>
  </g>
</svg>
