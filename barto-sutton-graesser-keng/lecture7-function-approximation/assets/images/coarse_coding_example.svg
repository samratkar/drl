<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Grid Lines -->
  <!-- Vertical Grid -->
  <line x1="40" y1="40" x2="40" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="80" y1="40" x2="80" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="120" y1="40" x2="120" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="160" y1="40" x2="160" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="200" y1="40" x2="200" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="240" y1="40" x2="240" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="280" y1="40" x2="280" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="320" y1="40" x2="320" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="360" y1="40" x2="360" y2="360" stroke="#e8e8e8" stroke-width="1" />
  
  <!-- Horizontal Grid -->
  <line x1="40" y1="360" x2="360" y2="360" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="320" x2="360" y2="320" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="280" x2="360" y2="280" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="240" x2="360" y2="240" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="200" x2="360" y2="200" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="160" x2="360" y2="160" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="120" x2="360" y2="120" stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="80"  x2="360" y2="80"  stroke="#e8e8e8" stroke-width="1" />
  <line x1="40" y1="40"  x2="360" y2="40"  stroke="#e8e8e8" stroke-width="1" />

  <!-- Main Axes -->
  <line x1="40" y1="360" x2="370" y2="360" stroke="#444444" stroke-width="2" />
  <line x1="40" y1="30" x2="40" y2="360" stroke="#444444" stroke-width="2" />

  <!-- X-Axis Labels -->
  <text x="40" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">0</text>
  <text x="80" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">1</text>
  <text x="120" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">2</text>
  <text x="160" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">3</text>
  <text x="200" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">4</text>
  <text x="240" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">5</text>
  <text x="280" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">6</text>
  <text x="320" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">7</text>
  <text x="360" y="380" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#555">8</text>
  <text x="200" y="405" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">X Coordinate</text>

  <!-- Y-Axis Labels -->
  <text x="25" y="364" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">0</text>
  <text x="25" y="324" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">1</text>
  <text x="25" y="284" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">2</text>
  <text x="25" y="244" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">3</text>
  <text x="25" y="204" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">4</text>
  <text x="25" y="164" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">5</text>
  <text x="25" y="124" font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">6</text>
  <text x="25" y="84"  font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">7</text>
  <text x="25" y="44"  font-family="sans-serif" font-size="10" text-anchor="end" fill="#555">8</text>
  <text x="15" y="200" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 15 200)" fill="#333">Y Coordinate</text>

  <!-- Coarse Coding Circles -->
  <!-- Circle A (Blue-ish) -->
  <circle cx="160" cy="240" r="120" fill="#31708f" fill-opacity="0.1" stroke="#31708f" stroke-dasharray="4,4" stroke-width="2" />
  <circle cx="160" cy="240" r="3" fill="#31708f" />
  <text x="80" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#31708f" text-anchor="middle">Circle A</text>

  <!-- Circle B (Green-ish) -->
  <circle cx="240" cy="240" r="120" fill="#3c763d" fill-opacity="0.1" stroke="#3c763d" stroke-dasharray="4,4" stroke-width="2" />
  <circle cx="240" cy="240" r="3" fill="#3c763d" />
  <text x="320" y="220" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3c763d" text-anchor="middle">Circle B</text>

  <!-- Circle C (Red-ish) -->
  <circle cx="200" cy="160" r="120" fill="#a94442" fill-opacity="0.1" stroke="#a94442" stroke-dasharray="4,4" stroke-width="2" />
  <circle cx="200" cy="160" r="3" fill="#a94442" />
  <text x="200" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a94442" text-anchor="middle">Circle C</text>

  <!-- State Points -->
  <!-- State s1 (Yellow) -->
  <circle cx="200" cy="240" r="6" fill="#f0ad4e" stroke="#ec971f" stroke-width="2" />
  <text x="200" y="228" font-family="sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">s₁ (4.0, 3.0)</text>

  <!-- State s2 (Red) -->
  <circle cx="100" cy="280" r="6" fill="#d9534f" stroke="#c9302c" stroke-width="2" />
  <text x="100" y="296" font-family="sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">s₂ (1.5, 2.0)</text>
</svg>
