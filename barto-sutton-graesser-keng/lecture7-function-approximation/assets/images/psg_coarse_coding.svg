<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="6" />

  <!-- Title -->
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PSG State Space &amp; Coarse Coding (Overlapping Receptive Fields)</text>
  <text x="20" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Visualizing variable-sized circular receptive fields for safety monitoring</text>

  <!-- Zones Group -->
  <!-- 1. Normal Sleep Zone (Safe - Green) -->
  <rect x="250" y="50" width="200" height="280" fill="#22c55e" fill-opacity="0.06" />
  
  <!-- 2. Hypopnea Zone (Warning - Orange) -->
  <rect x="90" y="97" width="160" height="233" fill="#f97316" fill-opacity="0.06" />

  <!-- 3. Apnea Zone (Danger - Red) -->
  <rect x="50" y="143" width="40" height="187" fill="#ef4444" fill-opacity="0.08" />

  <!-- Main Axes -->
  <line x1="50" y1="330" x2="460" y2="330" stroke="#1e293b" stroke-width="2" />
  <line x1="50" y1="40" x2="50" y2="330" stroke="#1e293b" stroke-width="2" />

  <!-- X-Axis Labels -->
  <text x="50" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">0%</text>
  <text x="130" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">20%</text>
  <text x="210" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">40%</text>
  <text x="290" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">60%</text>
  <text x="370" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">80%</text>
  <text x="450" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">100%</text>
  <text x="250" y="375" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Airflow Amplitude (Breathing Depth)</text>

  <!-- Y-Axis Labels -->
  <text x="42" y="334" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">70%</text>
  <text x="42" y="287" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">75%</text>
  <text x="42" y="240" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">80%</text>
  <text x="42" y="193" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">85%</text>
  <text x="42" y="147" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">90%</text>
  <text x="42" y="100" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">95%</text>
  <text x="42" y="54"  font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">100%</text>
  <text x="15" y="190" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 15 190)" fill="#1e293b">Blood Oxygen Saturation (SpO₂)</text>

  <!-- Coarse Coding Receptive Fields (Circles) -->
  <!-- 1. Large, Sparse Fields in Normal Sleep Zone (Safe) -->
  <circle cx="350" cy="190" r="90" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <circle cx="380" cy="110" r="70" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <circle cx="290" cy="140" r="80" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />

  <!-- 2. Medium Fields in Hypopnea Zone (Warning) -->
  <circle cx="170" cy="210" r="50" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <circle cx="210" cy="160" r="45" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <circle cx="130" cy="250" r="55" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <circle cx="150" cy="140" r="40" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />

  <!-- 3. Small, Dense Fields in Apnea Danger Zone (High-Resolution) -->
  <circle cx="70" cy="218" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8" />
  <circle cx="78" cy="205" r="18" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.8" />
  <circle cx="62" cy="230" r="15" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.8" />
  <circle cx="68" cy="190" r="20" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.8" />
  <circle cx="75" cy="245" r="25" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8" />
  <circle cx="60" cy="270" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.8" />
  <circle cx="65" cy="160" r="18" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.8" />

  <!-- Patient Points -->
  <!-- Patient A: Apnea (SpO2=82%, Airflow=5% -> screen 70, 218) -->
  <circle cx="70" cy="218" r="5" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <text x="80" y="222" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">Patient A (Apnea)</text>
  
  <!-- Highlight active fields for Patient A -->
  <!-- Let's color-fill the active circles for Patient A -->
  <circle cx="70" cy="218" r="22" fill="#ef4444" fill-opacity="0.1" stroke="#dc2626" stroke-width="2" />
  <circle cx="78" cy="205" r="18" fill="#ef4444" fill-opacity="0.1" stroke="#dc2626" stroke-width="2" />
  <circle cx="68" cy="190" r="20" fill="#ef4444" fill-opacity="0.1" stroke="#dc2626" stroke-width="2" />

  <!-- Patient B: Normal (SpO2=98%, Airflow=80% -> screen 370, 68.7) -->
  <circle cx="370" cy="68.7" r="5" fill="#22c55e" stroke="#15803d" stroke-width="2" />
  <text x="360" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d" text-anchor="end">Patient B (Normal)</text>

  <!-- Legend Box -->
  <rect x="250" y="240" width="190" height="75" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <!-- Item 1: Large Circles -->
  <circle cx="265" cy="255" r="6" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2" />
  <text x="280" y="258" font-family="sans-serif" font-size="9" fill="#475569">Large Safe Fields (Coarse)</text>
  <!-- Item 2: Medium Circles -->
  <circle cx="265" cy="275" r="5" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="2,2" />
  <text x="280" y="278" font-family="sans-serif" font-size="9" fill="#475569">Medium Warning Fields</text>
  <!-- Item 3: Small Circles -->
  <circle cx="265" cy="295" r="4" fill="#ef4444" fill-opacity="0.2" stroke="#dc2626" stroke-width="1.5" />
  <text x="280" y="298" font-family="sans-serif" font-size="9" fill="#dc2626" font-weight="bold">Small Danger Fields (Fine)</text>
</svg>
