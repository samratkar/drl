<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <rect width="600" height="350" fill="#fafafa"/>
  <text x="300" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">AlphaGo Dual-Network Architecture</text>
  
  <!-- Input -->
  <rect x="30" y="125" width="60" height="60" fill="#bdc3c7" stroke="#7f8c8d" rx="8" ry="8"/>
  <text x="60" y="200" font-family="Arial" font-size="12" text-anchor="middle">19x19x48</text>
  <text x="60" y="215" font-family="Arial" font-size="10" text-anchor="middle">Board State</text>
  
  <!-- Split Paths -->
  <line x1="90" y1="155" x2="150" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="155" x2="150" y2="85" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="155" x2="150" y2="235" stroke="#333" stroke-width="2"/>

  <!-- Top Path: Policy Net -->
  <line x1="150" y1="85" x2="200" y2="85" stroke="#333" stroke-width="2"/>
  <rect x="200" y="60" width="100" height="50" fill="#3498db" stroke="#2980b9" rx="8" ry="8"/>
  <text x="250" y="80" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Policy Network</text>
  <text x="250" y="95" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">13 Conv Layers</text>
  <line x1="300" y1="85" x2="380" y2="85" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <rect x="380" y="55" width="60" height="60" fill="#2ecc71" stroke="#27ae60" rx="8" ry="8"/>
  <text x="410" y="75" font-family="Arial" font-size="12" text-anchor="middle">19x19</text>
  <text x="410" y="90" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">P(a|s)</text>
  <text x="410" y="105" font-family="Arial" font-size="10" text-anchor="middle">Move Probs</text>

  <!-- Bottom Path: Value Net -->
  <line x1="150" y1="235" x2="200" y2="235" stroke="#333" stroke-width="2"/>
  <rect x="200" y="210" width="100" height="50" fill="#e74c3c" stroke="#c0392b" rx="8" ry="8"/>
  <text x="250" y="230" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Value Network</text>
  <text x="250" y="245" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">13 Conv + FC Layers</text>
  <line x1="300" y1="235" x2="380" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <circle cx="410" cy="235" r="30" fill="#f1c40f" stroke="#f39c12"/>
  <text x="410" y="230" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">V(s)</text>
  <text x="410" y="245" font-family="Arial" font-size="10" text-anchor="middle">Win Prob</text>
  
  <!-- MCTS Combine -->
  <rect x="490" y="115" width="80" height="80" fill="#9b59b6" stroke="#8e44ad" rx="8" ry="8"/>
  <text x="530" y="145" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">MCTS</text>
  <text x="530" y="165" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">Tree Search</text>
  <line x1="440" y1="85" x2="530" y2="85" stroke="#333" stroke-width="2"/>
  <line x1="530" y1="85" x2="530" y2="115" stroke="#333" stroke-width="2"/>
  <line x1="440" y1="235" x2="530" y2="235" stroke="#333" stroke-width="2"/>
  <line x1="530" y1="235" x2="530" y2="195" stroke="#333" stroke-width="2"/>

</svg>