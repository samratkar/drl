<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- Background -->
  <rect width="500" height="300" fill="#f8f9fa"/>
  <text x="250" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">TD-Gammon Architecture</text>
  
  <!-- Input Layer -->
  <rect x="50" y="80" width="80" height="180" fill="#d1ecf1" stroke="#17a2b8" stroke-width="2" rx="8" ry="8"/>
  <text x="90" y="100" font-family="Arial" font-size="12" text-anchor="middle">198 Inputs</text>
  <circle cx="90" cy="130" r="10" fill="#17a2b8"/>
  <circle cx="90" cy="170" r="10" fill="#17a2b8"/>
  <circle cx="90" cy="210" r="10" fill="#17a2b8"/>
  <circle cx="90" cy="240" r="2" fill="#17a2b8"/>
  <circle cx="90" cy="250" r="2" fill="#17a2b8"/>
  <text x="90" y="275" font-family="Arial" font-size="10" text-anchor="middle">Board State</text>

  <!-- Hidden Layer -->
  <rect x="210" y="60" width="80" height="220" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="8" ry="8"/>
  <text x="250" y="80" font-family="Arial" font-size="12" text-anchor="middle">80 Hidden</text>
  <circle cx="250" cy="110" r="10" fill="#28a745"/>
  <circle cx="250" cy="150" r="10" fill="#28a745"/>
  <circle cx="250" cy="190" r="10" fill="#28a745"/>
  <circle cx="250" cy="230" r="10" fill="#28a745"/>
  <circle cx="250" cy="260" r="2" fill="#28a745"/>
  
  <!-- Output Layer -->
  <rect x="370" y="130" width="80" height="80" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="8" ry="8"/>
  <text x="410" y="150" font-family="Arial" font-size="12" text-anchor="middle">1 Output</text>
  <circle cx="410" cy="180" r="10" fill="#dc3545"/>
  <text x="410" y="225" font-family="Arial" font-size="10" text-anchor="middle">P(Win)</text>

  <!-- Connections -->
  <line x1="130" y1="130" x2="210" y2="110" stroke="#ccc" stroke-width="1"/>
  <line x1="130" y1="130" x2="210" y2="150" stroke="#ccc" stroke-width="1"/>
  <line x1="130" y1="170" x2="210" y2="150" stroke="#ccc" stroke-width="1"/>
  <line x1="130" y1="170" x2="210" y2="190" stroke="#ccc" stroke-width="1"/>
  <line x1="130" y1="210" x2="210" y2="190" stroke="#ccc" stroke-width="1"/>
  
  <line x1="290" y1="110" x2="370" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="150" x2="370" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="190" x2="370" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="230" x2="370" y2="180" stroke="#ccc" stroke-width="1"/>
</svg>