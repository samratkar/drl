<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300">
  <rect width="600" height="300" fill="#ffffff"/>
  <text x="300" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Deep Q-Network (DQN) Architecture</text>
  
  <!-- Inputs -->
  <rect x="20" y="100" width="40" height="40" fill="#333" opacity="0.4" rx="8" ry="8"/>
  <rect x="30" y="110" width="40" height="40" fill="#333" opacity="0.6" rx="8" ry="8"/>
  <rect x="40" y="120" width="40" height="40" fill="#333" opacity="0.8" rx="8" ry="8"/>
  <rect x="50" y="130" width="40" height="40" fill="#333" opacity="1.0" stroke="#000" rx="8" ry="8"/>
  <text x="50" y="190" font-family="Arial" font-size="10" text-anchor="middle">84x84x4</text>
  <text x="50" y="205" font-family="Arial" font-size="10" text-anchor="middle">Frames</text>

  <!-- Conv1 -->
  <polygon points="120,80 150,110 150,230 120,200" fill="#3498db" stroke="#2980b9" stroke-linejoin="round"/>
  <text x="135" y="245" font-family="Arial" font-size="10" text-anchor="middle">Conv 1</text>
  <text x="135" y="260" font-family="Arial" font-size="8" text-anchor="middle">8x8, stride 4</text>

  <!-- Conv2 -->
  <polygon points="190,100 210,120 210,210 190,190" fill="#9b59b6" stroke="#8e44ad" stroke-linejoin="round"/>
  <text x="200" y="245" font-family="Arial" font-size="10" text-anchor="middle">Conv 2</text>
  <text x="200" y="260" font-family="Arial" font-size="8" text-anchor="middle">4x4, stride 2</text>
  
  <!-- Conv3 -->
  <polygon points="250,120 265,135 265,195 250,180" fill="#e67e22" stroke="#d35400" stroke-linejoin="round"/>
  <text x="257" y="245" font-family="Arial" font-size="10" text-anchor="middle">Conv 3</text>
  <text x="257" y="260" font-family="Arial" font-size="8" text-anchor="middle">3x3, stride 1</text>

  <!-- FC1 -->
  <rect x="330" y="60" width="30" height="180" fill="#f1c40f" stroke="#f39c12" rx="8" ry="8"/>
  <text x="345" y="255" font-family="Arial" font-size="10" text-anchor="middle">FC (512)</text>

  <!-- Output -->
  <rect x="440" y="90" width="30" height="120" fill="#e74c3c" stroke="#c0392b" rx="8" ry="8"/>
  <text x="455" y="230" font-family="Arial" font-size="10" text-anchor="middle">Q(s, a)</text>
  <text x="455" y="245" font-family="Arial" font-size="8" text-anchor="middle">(18 Joystick Actions)</text>

  <!-- Lines -->
  <line x1="95" y1="150" x2="115" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="155" y1="150" x2="185" y2="150" stroke="#555" stroke-width="2"/>
  <line x1="215" y1="150" x2="245" y2="150" stroke="#555" stroke-width="2"/>
  <line x1="270" y1="150" x2="325" y2="150" stroke="#555" stroke-width="2"/>
  <line x1="365" y1="150" x2="435" y2="150" stroke="#555" stroke-width="2"/>
</svg>