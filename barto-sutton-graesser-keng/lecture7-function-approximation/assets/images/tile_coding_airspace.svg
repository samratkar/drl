<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="100%" height="100%">
  <!-- Definitions for elements -->
  <defs>
    <!-- Ownship Airplane (Blue) -->
    <g id="ownship-plane">
      <path d="M0,-12 L2,-4 L12,-1 L12,1 L2,-1 L0,5 L4,8 L4,10 L0,8 L-4,10 L-4,8 L0,5 L-2,-1 L-12,1 L-12,-1 L-2,-4 Z" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5" />
    </g>
    <!-- Intruder Airplane (Red) -->
    <g id="intruder-plane">
      <path d="M0,-12 L2,-4 L12,-1 L12,1 L2,-1 L0,5 L4,8 L4,10 L0,8 L-4,10 L-4,8 L0,5 L-2,-1 L-12,1 L-12,-1 L-2,-4 Z" fill="#ef4444" stroke="#dc2626" stroke-width="1.5" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#fafafa" rx="6" />

  <!-- Title -->
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Tile Coding in Aircraft State Space (2 Overlapping Tilings)</text>
  <text x="20" y="48" font-family="sans-serif" font-size="10" fill="#64748b">Visualizing how large tiles intersect to create fine-grained resolution</text>

  <!-- Grids Group (offset view area) -->
  <g transform="translate(10, 20)">

    <!-- Tiling 1: Active Tile Shading (Red-ish) -->
    <!-- Tile boundaries: X: 130 to 190, Y: 80 to 140 -->
    <rect x="130" y="80" width="60" height="60" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />

    <!-- Tiling 2: Active Tile Shading (Blue-ish) -->
    <!-- Tile boundaries: X: 175 to 235, Y: 95 to 155 -->
    <rect x="175" y="95" width="60" height="60" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2" stroke-dasharray="1,2" />

    <!-- Overlap / Intersection Region (Purple-ish) -->
    <!-- X: 175 to 190, Y: 95 to 140 -->
    <rect x="175" y="95" width="15" height="45" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.5" />

    <!-- Grid 1 (Tiling 1 - Solid Gray, Origin at Ownship 250,200) -->
    <!-- Vertical Lines -->
    <line x1="70" y1="20" x2="70" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="130" y1="20" x2="130" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="190" y1="20" x2="190" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="250" y1="20" x2="250" y2="380" stroke="#94a3b8" stroke-width="2" /> <!-- Axis X=0 -->
    <line x1="310" y1="20" x2="310" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="370" y1="20" x2="370" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="430" y1="20" x2="430" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Horizontal Lines -->
    <line x1="70" y1="380" x2="430" y2="380" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="320" x2="430" y2="320" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="260" x2="430" y2="260" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="200" x2="430" y2="200" stroke="#94a3b8" stroke-width="2" /> <!-- Axis Y=0 -->
    <line x1="70" y1="140" x2="430" y2="140" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="80"  x2="430" y2="80"  stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="70" y1="20"  x2="430" y2="20"  stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Grid 2 (Tiling 2 - Dashed Light Blue, Offset by -250m = -15px) -->
    <!-- Vertical Lines -->
    <line x1="55" y1="20" x2="55" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="115" y1="20" x2="115" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="175" y1="20" x2="175" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="235" y1="20" x2="235" y2="380" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" /> <!-- T2 Axis -->
    <line x1="295" y1="20" x2="295" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="355" y1="20" x2="355" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="415" y1="20" x2="415" y2="380" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Horizontal Lines -->
    <line x1="70" y1="395" x2="430" y2="395" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="70" y1="335" x2="430" y2="335" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="70" y1="275" x2="430" y2="275" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="70" y1="215" x2="430" y2="215" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" /> <!-- T2 Axis -->
    <line x1="70" y1="155" x2="430" y2="155" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="70" y1="95"  x2="430" y2="95"  stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />
    <line x1="70" y1="35"  x2="430" y2="35"  stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,4" />

    <!-- Coordinate Labels (Tiling 1 Grid) -->
    <text x="250" y="394" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">0m</text>
    <text x="310" y="394" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">+1000m</text>
    <text x="370" y="394" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">+2000m</text>
    <text x="190" y="394" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">-1000m</text>
    <text x="130" y="394" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="middle">-2000m</text>

    <text x="434" y="203" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="start">0m</text>
    <text x="434" y="143" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="start">+1000m</text>
    <text x="434" y="83"  font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="start">+2000m</text>
    <text x="434" y="263" font-family="sans-serif" font-size="8" fill="#64748b" text-anchor="start">-1000m</text>

    <!-- Ownship (At origin 250, 200) -->
    <use href="#ownship-plane" x="250" y="200" />
    <text x="250" y="185" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0ea5e9" text-anchor="middle">Ownship (0, 0)</text>

    <!-- Protected Zone Boundary (500m radius = 30px) -->
    <circle cx="250" cy="200" r="30" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2" />
    <text x="282" y="196" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ef4444">Protected Zone (500m)</text>

    <!-- Intruder (At relative position -1200m, +1400m -> screen 178, 116) -->
    <use href="#intruder-plane" x="178" y="116" />
    <text x="170" y="108" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">Intruder</text>
    <text x="170" y="120" font-family="sans-serif" font-size="8" fill="#475569" text-anchor="end">(-1200m, 1400m)</text>

    <!-- Indication Line for Intersection -->
    <!-- Pointer pointing to the purple overlap region -->
    <path d="M 160,115 L 182,117" stroke="#6b21a8" stroke-width="1" marker-end="url(#arrow)" />
    
    <!-- Text callout for overlap -->
    <text x="162" y="70" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a855f7" text-anchor="middle">Effective Intersection</text>
    <text x="162" y="80" font-family="sans-serif" font-size="8" fill="#6b21a8" text-anchor="middle">Resolution (125m x 125m)</text>
    <path d="M 162,82 L 180,98" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Legend (Placed on the right side) -->
  <g transform="translate(440, 65)">
    <!-- Legend Box -->
    <rect x="0" y="0" width="100" height="260" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="10" y="18" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e293b">Legend</text>
    
    <!-- Item 1: Tiling 1 -->
    <line x1="10" y1="35" x2="30" y2="35" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="35" y="38" font-family="sans-serif" font-size="9" fill="#475569">Tiling 1 Grid</text>
    
    <!-- Item 2: Tiling 2 -->
    <line x1="10" y1="55" x2="30" y2="55" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="35" y="58" font-family="sans-serif" font-size="9" fill="#475569">Tiling 2 (Offset)</text>

    <!-- Item 3: Active Tile 1 -->
    <rect x="10" y="75" width="15" height="15" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" />
    <text x="35" y="86" font-family="sans-serif" font-size="9" fill="#475569">Active Tile 1</text>
    <text x="35" y="96" font-family="sans-serif" font-size="8" fill="#94a3b8">(1000m x 1000m)</text>

    <!-- Item 4: Active Tile 2 -->
    <rect x="10" y="115" width="15" height="15" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1" stroke-dasharray="1,1" />
    <text x="35" y="126" font-family="sans-serif" font-size="9" fill="#475569">Active Tile 2</text>
    <text x="35" y="136" font-family="sans-serif" font-size="8" fill="#94a3b8">(1000m x 1000m)</text>

    <!-- Item 5: Overlap Intersection -->
    <rect x="10" y="155" width="15" height="15" fill="#a855f7" fill-opacity="0.3" stroke="#a855f7" stroke-width="1.5" />
    <text x="35" y="166" font-family="sans-serif" font-size="9" fill="#a855f7" font-weight="bold">Intersection</text>
    <text x="35" y="176" font-family="sans-serif" font-size="8" fill="#6b21a8">(Resolution overlap)</text>

    <!-- Tile size label -->
    <text x="10" y="210" font-family="sans-serif" font-size="9" font-weight="bold" fill="#334155">Tile Dimensions:</text>
    <text x="10" y="222" font-family="sans-serif" font-size="8" fill="#475569">- Tile Width: 1000m</text>
    <text x="10" y="234" font-family="sans-serif" font-size="8" fill="#475569">- Offset: 250m</text>
    <text x="10" y="246" font-family="sans-serif" font-size="8" fill="#475569">- Res. Step: 250m</text>
  </g>
</svg>
