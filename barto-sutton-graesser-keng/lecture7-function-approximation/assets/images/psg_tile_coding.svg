<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 420" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" rx="6" />

  <!-- Title -->
  <text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e293b">PSG State Space &amp; Tile Coding Representation</text>
  <text x="20" y="46" font-family="sans-serif" font-size="10" fill="#64748b">Mapping Patient physiological signals (SpO₂ vs. Airflow Amplitude)</text>

  <!-- Zones Group -->
  <!-- 1. Normal Sleep Zone (Safe - Green) -->
  <!-- Airflow 50% to 100% (x: 250 to 450), SpO2 95% to 100% (y: 50 to 97) -->
  <rect x="250" y="50" width="200" height="280" fill="#22c55e" fill-opacity="0.08" />
  
  <!-- 2. Hypopnea Zone (Warning - Orange) -->
  <!-- Airflow 10% to 50% (x: 90 to 250), SpO2 90% to 95% (y: 97 to 143) -->
  <rect x="90" y="97" width="160" height="233" fill="#f97316" fill-opacity="0.08" />

  <!-- 3. Apnea Zone (Danger - Red) -->
  <!-- Airflow 0% to 10% (x: 50 to 90), SpO2 70% to 90% (y: 143 to 330) -->
  <rect x="50" y="143" width="40" height="187" fill="#ef4444" fill-opacity="0.12" />

  <!-- Grid 1 (Tiling 1 - Solid Gray) -->
  <!-- Vertical lines -->
  <line x1="50" y1="50" x2="50" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="90" y1="50" x2="90" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="130" y1="50" x2="130" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="170" y1="50" x2="170" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="210" y1="50" x2="210" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="250" y1="50" x2="250" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="290" y1="50" x2="290" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="330" y1="50" x2="330" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="370" y1="50" x2="370" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="410" y1="50" x2="410" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="450" y1="50" x2="450" y2="330" stroke="#cbd5e1" stroke-width="1" />
  
  <!-- Horizontal lines -->
  <line x1="50" y1="330" x2="450" y2="330" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="283.3" x2="450" y2="283.3" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="236.7" x2="450" y2="236.7" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="190" x2="450" y2="190" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="143.3" x2="450" y2="143.3" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="96.7" x2="450" y2="96.7" stroke="#cbd5e1" stroke-width="1" />
  <line x1="50" y1="50" x2="450" y2="50" stroke="#cbd5e1" stroke-width="1" />

  <!-- Grid 2 (Tiling 2 - Dashed Blue, Offset by +15px x, -15px y) -->
  <!-- Vertical lines -->
  <line x1="65" y1="50" x2="65" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="105" y1="50" x2="105" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="145" y1="50" x2="145" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="185" y1="50" x2="185" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="225" y1="50" x2="225" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="265" y1="50" x2="265" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="305" y1="50" x2="305" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="345" y1="50" x2="345" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="385" y1="50" x2="385" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="425" y1="50" x2="425" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="465" y1="50" x2="465" y2="330" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  
  <!-- Horizontal lines -->
  <line x1="50" y1="315" x2="450" y2="315" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="268.3" x2="450" y2="268.3" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="221.7" x2="450" y2="221.7" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="175" x2="450" y2="175" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="128.3" x2="450" y2="128.3" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="81.7" x2="450" y2="81.7" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />
  <line x1="50" y1="35" x2="450" y2="35" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.7" />

  <!-- Main Axes -->
  <line x1="50" y1="330" x2="460" y2="330" stroke="#1e293b" stroke-width="2" />
  <line x1="50" y1="40" x2="50" y2="330" stroke="#1e293b" stroke-width="2" />

  <!-- X-Axis (Airflow Amplitude) Labels -->
  <text x="50" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">0%</text>
  <text x="130" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">20%</text>
  <text x="210" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">40%</text>
  <text x="290" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">60%</text>
  <text x="370" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">80%</text>
  <text x="450" y="348" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#334155">100%</text>
  <text x="250" y="375" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e293b">Airflow Amplitude (Breathing Depth)</text>

  <!-- Y-Axis (SpO2) Labels -->
  <text x="42" y="334" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">70%</text>
  <text x="42" y="287" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">75%</text>
  <text x="42" y="240" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">80%</text>
  <text x="42" y="193" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">85%</text>
  <text x="42" y="147" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">90%</text>
  <text x="42" y="100" font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">95%</text>
  <text x="42" y="54"  font-family="sans-serif" font-size="10" text-anchor="end" fill="#334155">100%</text>
  <text x="15" y="190" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 15 190)" fill="#1e293b">Blood Oxygen Saturation (SpO₂)</text>

  <!-- Highlight Zones Labels -->
  <text x="70" y="260" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626" transform="rotate(-90 70 260)" text-anchor="middle">APNEA ZONE</text>
  <text x="170" y="210" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">HYPOPNEA ZONE</text>
  <text x="350" y="190" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a" text-anchor="middle">NORMAL SLEEP ZONE</text>

  <!-- Patient Points -->
  <!-- Patient A: Apnea (SpO2=82%, Airflow=5% -> screen 70, 218) -->
  <circle cx="70" cy="218" r="6" fill="#ef4444" stroke="#b91c1c" stroke-width="2" />
  <text x="80" y="222" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">Patient A (Apnea)</text>
  
  <!-- Highlight active tiles for Patient A -->
  <!-- Tiling 1: Tile covering (70, 218) -> X: 50-90, Y: 190-236.7 -->
  <rect x="50" y="190" width="40" height="46.7" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="2,2" />
  
  <!-- Tiling 2: Tile covering (70, 218) -> X: 65-105, Y: 175-221.7 -->
  <rect x="65" y="175" width="40" height="46.7" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="1,1" />

  <!-- Patient B: Normal (SpO2=98%, Airflow=80% -> screen 370, 68.7) -->
  <circle cx="370" cy="68.7" r="6" fill="#22c55e" stroke="#15803d" stroke-width="2" />
  <text x="360" y="63" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d" text-anchor="end">Patient B (Normal)</text>

  <!-- Grid Intersection Pointer -->
  <path d="M 110,240 L 90,210" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2" />
  <text x="115" y="246" font-family="sans-serif" font-size="9" font-weight="bold" fill="#7c3aed">Active Tile Intersection</text>

  <!-- Legend Box -->
  <rect x="260" y="240" width="180" height="75" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <!-- Item 1: Grid 1 -->
  <line x1="270" y1="255" x2="290" y2="255" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="295" y="258" font-family="sans-serif" font-size="9" fill="#475569">Tiling 1 Grid</text>
  <!-- Item 2: Grid 2 -->
  <line x1="270" y1="275" x2="290" y2="275" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="295" y="278" font-family="sans-serif" font-size="9" fill="#475569">Tiling 2 Grid (Offset)</text>
  <!-- Item 3: Active Tiles -->
  <rect x="270" y="290" width="10" height="10" fill="none" stroke="#7c3aed" stroke-width="1.5" />
  <text x="295" y="298" font-family="sans-serif" font-size="9" fill="#7c3aed" font-weight="bold">Intersection (Resolves State)</text>
</svg>
