<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <rect width="500" height="350" fill="#fcfcfc"/>
  <text x="250" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Overestimation Bias in Standard DQN</text>
  
  <!-- Axes -->
  <line x1="50" y1="300" x2="450" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="50" y1="300" x2="50" y2="50" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <text x="250" y="330" font-family="Arial" font-size="12" text-anchor="middle">Training Episodes / Steps</text>
  <text x="30" y="180" font-family="Arial" font-size="12" text-anchor="middle" transform="rotate(-90 30,180)">Estimated Q-Value</text>

  <!-- True Value Line -->
  <line x1="50" y1="200" x2="450" y2="200" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="460" y="205" font-family="Arial" font-size="12" fill="#27ae60">True Optimal Q-Value</text>

  <!-- DQN Curve (Diverging) -->
  <path d="M 50 250 Q 150 220 200 150 T 400 60" fill="none" stroke="#e74c3c" stroke-width="3"/>
  
  <!-- DDQN Curve (Stable) -->
  <path d="M 50 250 Q 150 230 200 200 T 400 195" fill="none" stroke="#2980b9" stroke-width="3"/>

  <!-- Legend -->
  <rect x="70" y="60" width="150" height="60" fill="#fff" stroke="#ccc" rx="8" ry="8"/>
  <line x1="80" y1="75" x2="110" y2="75" stroke="#e74c3c" stroke-width="3"/>
  <text x="120" y="80" font-family="Arial" font-size="12">Standard DQN</text>
  <line x1="80" y1="100" x2="110" y2="100" stroke="#2980b9" stroke-width="3"/>
  <text x="120" y="105" font-family="Arial" font-size="12">Double DQN</text>
  
  <text x="170" y="140" font-family="Arial" font-size="10" fill="#e74c3c">Positive bias accumulates</text>
  <text x="170" y="152" font-family="Arial" font-size="10" fill="#e74c3c">due to the max operator</text>
</svg>