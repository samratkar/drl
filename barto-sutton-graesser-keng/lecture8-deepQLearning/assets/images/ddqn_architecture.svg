<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 350" width="650" height="350">
  <rect width="650" height="350" fill="#f8f9fa"/>
  <text x="325" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Double DQN (DDQN) Target Calculation</text>
  
  <!-- State -->
  <rect x="50" y="140" width="60" height="40" fill="#bdc3c7" stroke="#7f8c8d" rx="8" ry="8"/>
  <text x="80" y="165" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">S_next</text>
  
  <line x1="110" y1="160" x2="160" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="135" y1="160" x2="135" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="135" y1="160" x2="135" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="135" y1="90" x2="160" y2="90" stroke="#333" stroke-width="2"/>
  <line x1="135" y1="230" x2="160" y2="230" stroke="#333" stroke-width="2"/>

  <!-- Online Network (Top) -->
  <rect x="160" y="60" width="140" height="60" fill="#3498db" stroke="#2980b9" rx="8" ry="8"/>
  <text x="230" y="85" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Online Network</text>
  <text x="230" y="100" font-family="Arial" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">Q(s', a; θ)</text>
  
  <!-- Target Network (Bottom) -->
  <rect x="160" y="200" width="140" height="60" fill="#e74c3c" stroke="#c0392b" rx="8" ry="8"/>
  <text x="230" y="225" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Target Network (Frozen)</text>
  <text x="230" y="240" font-family="Arial" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">Q(s', a; θ')</text>

  <!-- Step 1: Action Selection -->
  <line x1="300" y1="90" x2="360" y2="90" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="360" y="70" width="80" height="40" fill="#f1c40f" stroke="#f39c12" rx="8" ry="8"/>
  <text x="400" y="85" font-family="Arial" font-size="10" text-anchor="middle">1. Select Action</text>
  <text x="400" y="100" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">argmax_a</text>

  <!-- Step 2: Action Evaluation -->
  <line x1="400" y1="110" x2="400" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="230" x2="450" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="160" x2="450" y2="160" stroke="#333" stroke-width="2"/>
  
  <rect x="450" y="140" width="160" height="110" fill="#2ecc71" stroke="#27ae60" rx="8" ry="8"/>
  <text x="530" y="165" font-family="Arial" font-size="10" text-anchor="middle">2. Evaluate Action</text>
  <text x="530" y="185" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Q(s', argmax_a; θ')</text>
  
  <!-- Final Output -->
  <line x1="530" y1="250" x2="530" y2="280" stroke="#333" stroke-width="2"/>
  <text x="530" y="300" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Final TD Target y_j</text>
</svg>