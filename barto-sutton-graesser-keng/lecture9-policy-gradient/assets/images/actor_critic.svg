<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#fcfcfc"/>
  <text x="300" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Actor-Critic Neural Network Architecture</text>
  
  <!-- State -->
  <rect x="30" y="175" width="80" height="50" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2" rx="8" ry="8"/>
  <text x="70" y="205" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">State (S)</text>

  <!-- Backbone -->
  <rect x="150" y="150" width="120" height="100" fill="#ecf0f1" stroke="#95a5a6" stroke-width="2" rx="8" ry="8"/>
  <text x="210" y="195" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">Shared Backbone</text>
  <text x="210" y="215" font-family="Arial" font-size="10" text-anchor="middle">(Hidden Layers)</text>
  
  <line x1="110" y1="200" x2="150" y2="200" stroke="#333" stroke-width="2"/>
  
  <line x1="270" y1="200" x2="310" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="200" x2="310" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="310" y1="200" x2="310" y2="300" stroke="#333" stroke-width="2"/>

  <!-- Actor Head (Top) -->
  <line x1="310" y1="100" x2="350" y2="100" stroke="#333" stroke-width="2"/>
  <rect x="350" y="60" width="120" height="80" fill="#3498db" stroke="#2980b9" stroke-width="2" rx="8" ry="8"/>
  <text x="410" y="90" font-family="Arial" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Actor Head</text>
  <text x="410" y="110" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">(Parameters θ)</text>
  
  <line x1="470" y1="100" x2="510" y2="100" stroke="#333" stroke-width="2"/>
  <rect x="510" y="60" width="60" height="80" fill="#f8d7da" stroke="#dc3545" stroke-width="2" rx="8" ry="8"/>
  <text x="540" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">π(a|s)</text>
  <text x="540" y="115" font-family="Arial" font-size="10" text-anchor="middle">Softmax</text>

  <!-- Critic Head (Bottom) -->
  <line x1="310" y1="300" x2="350" y2="300" stroke="#333" stroke-width="2"/>
  <rect x="350" y="260" width="120" height="80" fill="#2ecc71" stroke="#27ae60" stroke-width="2" rx="8" ry="8"/>
  <text x="410" y="290" font-family="Arial" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">Critic Head</text>
  <text x="410" y="310" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">(Parameters w)</text>
  
  <line x1="470" y1="300" x2="510" y2="300" stroke="#333" stroke-width="2"/>
  <circle cx="540" cy="300" r="25" fill="#f1c40f" stroke="#f39c12" stroke-width="2"/>
  <text x="540" y="304" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">V(s)</text>
  <text x="540" y="340" font-family="Arial" font-size="10" text-anchor="middle">Linear</text>
</svg>