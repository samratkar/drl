<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320">
  <rect width="850" height="320" fill="#f8f9fa" rx="10" ry="10"/>
  
  <text x="425" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">REINFORCE with Baseline (Monte Carlo) vs. Actor-Critic (Bootstrapping)</text>
  
  <!-- Left Side: REINFORCE with Baseline -->
  <g transform="translate(40, 60)">
    <rect width="360" height="230" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="8" ry="8"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0056b3" text-anchor="middle">REINFORCE with Baseline</text>
    <text x="180" y="42" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">No Bootstrapping (Monte Carlo)</text>
    
    <!-- Timeline -->
    <g transform="translate(20, 75)">
      <!-- States and Actions -->
      <circle cx="20" cy="30" r="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <text x="20" y="34" font-family="Arial, sans-serif" font-size="10" fill="#01579b" text-anchor="middle">S_t</text>
      
      <line x1="34" y1="30" x2="86" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
      <text x="60" y="22" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">A_t</text>
      
      <circle cx="100" cy="30" r="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <text x="100" y="34" font-family="Arial, sans-serif" font-size="10" fill="#01579b" text-anchor="middle">S_t+1</text>
      
      <line x1="114" y1="30" x2="166" y2="30" stroke="#333" stroke-width="1.5" stroke-dasharray="2,2"/>
      
      <circle cx="180" cy="30" r="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <text x="180" y="34" font-family="Arial, sans-serif" font-size="10" fill="#01579b" text-anchor="middle">S_t+2</text>
      
      <line x1="194" y1="30" x2="286" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
      
      <circle cx="300" cy="30" r="14" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
      <text x="300" y="34" font-family="Arial, sans-serif" font-size="10" fill="#c62828" font-weight="bold" text-anchor="middle">S_T</text>
      <text x="300" y="52" font-family="Arial, sans-serif" font-size="8" fill="#c62828" text-anchor="middle">(Terminal)</text>
      
      <!-- Big bracket for return -->
      <path d="M 20 65 L 20 75 L 150 75 L 150 85 L 150 75 L 300 75 L 300 65" fill="none" stroke="#dc3545" stroke-width="1.5"/>
      <text x="150" y="100" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#dc3545" text-anchor="middle">Monte Carlo Return G_t</text>
      <text x="150" y="112" font-family="Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">(Must wait until end of episode)</text>
    </g>
    
    <!-- Update Equation -->
    <rect x="25" y="195" width="310" height="25" fill="#f8f9fa" stroke="#dee2e6" rx="4" ry="4"/>
    <text x="180" y="212" font-family="Cambria Math, Times New Roman, serif" font-size="11" fill="#212529" text-anchor="middle">
      θ ← θ + α γ^t ( G_t - V(S_t) ) ∇_θ ln π(A_t | S_t)
    </text>
  </g>
  
  <!-- Right Side: Actor-Critic (One-step Bootstrapping) -->
  <g transform="translate(450, 60)">
    <rect width="360" height="230" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="8" ry="8"/>
    <text x="180" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#28a745" text-anchor="middle">One-Step Actor-Critic</text>
    <text x="180" y="42" font-family="Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="middle">Bootstrapping (TD Learning)</text>
    
    <!-- Timeline -->
    <g transform="translate(60, 75)">
      <!-- States and Actions -->
      <circle cx="40" cy="30" r="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <text x="40" y="34" font-family="Arial, sans-serif" font-size="10" fill="#01579b" text-anchor="middle">S_t</text>
      
      <line x1="54" y1="30" x2="186" y2="30" stroke="#333" stroke-width="1.5" marker-end="url(#arrow-black)"/>
      <text x="120" y="22" font-family="Arial, sans-serif" font-size="9" fill="#333" text-anchor="middle">A_t  →  Reward R_t+1</text>
      
      <circle cx="200" cy="30" r="14" fill="#e1f5fe" stroke="#0288d1" stroke-width="1"/>
      <text x="200" y="34" font-family="Arial, sans-serif" font-size="10" fill="#01579b" text-anchor="middle">S_t+1</text>
      
      <!-- Small bracket for transition -->
      <path d="M 40 65 L 40 75 L 120 75 L 120 85 L 120 75 L 200 75 L 200 65" fill="none" stroke="#28a745" stroke-width="1.5"/>
      <text x="120" y="100" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#28a745" text-anchor="middle">TD Target: R_t+1 + γ V(S_t+1)</text>
      <text x="120" y="112" font-family="Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">(Update immediately at step t+1)</text>
    </g>
    
    <!-- Update Equation -->
    <rect x="25" y="195" width="310" height="25" fill="#f8f9fa" stroke="#dee2e6" rx="4" ry="4"/>
    <text x="180" y="212" font-family="Cambria Math, Times New Roman, serif" font-size="11" fill="#212529" text-anchor="middle">
      θ ← θ + α γ^t [ R_t+1 + γ V(S_t+1) - V(S_t) ] ∇_θ ln π
    </text>
  </g>
  
  <!-- Marker Definitions -->
  <defs>
    <marker id="arrow-black" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
