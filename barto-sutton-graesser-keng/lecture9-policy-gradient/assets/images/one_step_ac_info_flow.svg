<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" width="740" height="180">
  <rect width="740" height="180" fill="#fcfcfc" rx="8" ry="8" stroke="#dee2e6" stroke-width="1"/>
  
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L5,2.5 z" fill="#495057"/>
    </marker>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007bff"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28a745"/>
      <stop offset="100%" stop-color="#1e7e34"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fd7e14"/>
      <stop offset="100%" stop-color="#d35400"/>
    </linearGradient>
  </defs>

  <!-- Node 1: State S_t -->
  <rect x="20" y="65" width="80" height="50" fill="#e9ecef" stroke="#495057" stroke-width="1.5" rx="5" ry="5"/>
  <text x="60" y="90" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333" text-anchor="middle">State S_t</text>
  <text x="60" y="104" font-family="Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">(Observation)</text>

  <!-- S_t -> Actor -->
  <path d="M 100 90 L 120 90 L 120 50 L 140 50" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- S_t -> Critic -->
  <path d="M 100 90 L 120 90 L 120 130 L 140 130" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: Actor -->
  <rect x="140" y="25" width="120" height="50" fill="url(#blueGrad)" stroke="#004085" stroke-width="1.5" rx="5" ry="5"/>
  <text x="200" y="47" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Actor Network</text>
  <text x="200" y="61" font-family="Arial, sans-serif" font-size="9" fill="#d0e1fd" text-anchor="middle">Policy π_θ(a|s)</text>

  <!-- Node 3: Critic -->
  <rect x="140" y="105" width="120" height="50" fill="url(#greenGrad)" stroke="#1e7e34" stroke-width="1.5" rx="5" ry="5"/>
  <text x="200" y="127" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Critic Network</text>
  <text x="200" y="141" font-family="Arial, sans-serif" font-size="9" fill="#d4edda" text-anchor="middle">Baseline V_w(s)</text>

  <!-- Actor -> Action -->
  <path d="M 260 50 L 290 50" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: Action A_t -->
  <circle cx="315" cy="50" r="18" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="315" y="54" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#01579b" text-anchor="middle">A_t</text>
  <text x="315" y="80" font-family="Arial, sans-serif" font-size="9" fill="#0288d1" text-anchor="middle" font-weight="bold">Action</text>

  <!-- Action -> Env -->
  <path d="M 333 50 L 370 50" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 5: Environment -->
  <rect x="370" y="25" width="100" height="50" fill="#343a40" stroke="#212529" stroke-width="1.5" rx="5" ry="5"/>
  <text x="420" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Environment</text>

  <!-- Env -> Transition Output -->
  <path d="M 470 50 L 500 50" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 6: TD Target (R_t+1 + γ V(S_t+1)) -->
  <rect x="500" y="20" width="220" height="60" fill="#f8f9fa" stroke="#6c757d" stroke-width="1" rx="4" ry="4"/>
  <text x="610" y="38" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#495057" text-anchor="middle">Transition Result</text>
  <text x="610" y="54" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">Reward R_t+1  &amp;  Next State S_t+1</text>
  <text x="610" y="70" font-family="Arial, sans-serif" font-size="9" fill="#6c757d" text-anchor="middle">Provides V_w(S_t+1) bootstrapping</text>

  <!-- Transition -> TD Error calculation -->
  <path d="M 610 80 L 610 130 L 480 130" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Critic V_w(S_t) -> TD Error -->
  <path d="M 260 130 L 410 130" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 7: TD Error (Advantage) -->
  <rect x="410" y="105" width="70" height="50" fill="#fff3cd" stroke="#ffc107" stroke-width="1.5" rx="5" ry="5"/>
  <text x="445" y="127" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#856404" text-anchor="middle">δ_t</text>
  <text x="445" y="141" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#856404" text-anchor="middle">TD Error</text>

  <!-- TD Error update Actor & Critic -->
  <path d="M 445 155 L 445 170 L 80 170 L 80 120" fill="none" stroke="#fd7e14" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="262" y="166" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#d35400">Update Policy &amp; Value weights online at each step</text>
</svg>
